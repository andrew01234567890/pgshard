// Router to pooler contract: pgwire-shaped statements and results per shard.
syntax = "proto3";

package pgshard.v1;

import "pgshard/v1/common.proto";

option go_package = "github.com/andrew01234567890/pgshard/internal/gen/pgshard/v1;pgshardv1";

// Pooler fronts one PostgreSQL shard and multiplexes router sessions onto
// backend connections. Message shapes mirror the PostgreSQL wire protocol.
service Pooler {
  // Execute carries an ordered stream of pgwire-like requests for one or more
  // router sessions and returns the mirrored responses. Bidirectional.
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse);
  // Reserve pins a dedicated backend to the session (transactions, cursors,
  // session-level state). Released explicitly with Release.
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  // Release returns a pinned backend to the pool.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // Cancel interrupts the statement currently running for a session.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Health streams the shard's role and lag; the router uses it for routing
  // and read-replica selection.
  rpc Health(HealthRequest) returns (stream HealthStatus);
  // StreamChanges exposes logical decoding output from the shard, one
  // event per message. Stream is the batched form used by the controller.
  rpc StreamChanges(StreamRequest) returns (stream ChangeEvent);
  // Stream opens the shard's slot for a change stream and streams decoded
  // pgoutput events batched per transaction (or per batch_bytes). Only one
  // reader per slot is admitted; a second one is refused with
  // FAILED_PRECONDITION. With start_lsn zero the slot resumes from its
  // confirmed position. Keepalive batches prove liveness while idle.
  rpc Stream(StreamRequest) returns (stream ChangeBatch);
  // Ack advances the slot's confirmed position; events up to and including
  // lsn are never resent after a restart.
  rpc Ack(AckRequest) returns (AckResponse);
  // CopyTables exports a snapshot from a logical slot (the stream's slot
  // when it does not exist yet, a temporary one otherwise) and streams the
  // rows of every table of the publication as seen by that snapshot, in
  // primary-key order with a checkpoint per batch.
  rpc CopyTables(CopyTablesRequest) returns (stream CopyTablesResponse);
}

// UserIdentity carries the SCRAM verifier material for the client user.
// SENSITIVE: contains key material; never log or persist these fields.
message UserIdentity {
  // Role name the client authenticated as.
  string username = 1;
  // SCRAM ClientKey bytes. Sensitive.
  bytes scram_client_key = 2;
  // SCRAM ServerKey bytes. Sensitive.
  bytes scram_server_key = 3;
}

// SimpleQuery is the pgwire Query message.
message SimpleQuery {
  // One or more SQL statements separated by semicolons.
  string sql = 1;
}

// Parse is the pgwire Parse message.
message Parse {
  // Prepared statement name; empty for the unnamed statement.
  string name = 1;
  // SQL text with $n placeholders.
  string sql = 2;
  // Parameter type OIDs; zero lets the server infer.
  repeated uint32 param_oids = 3;
}

// Bind is the pgwire Bind message.
message Bind {
  // Destination portal name; empty for the unnamed portal.
  string portal = 1;
  // Source prepared statement name.
  string statement = 2;
  // Parameter values encoded per param_formats.
  repeated Value params = 3;
  // Parameter formats (0 text, 1 binary); one, zero or per-param entries.
  repeated int32 param_formats = 4;
  // Result column formats (0 text, 1 binary); one, zero or per-column entries.
  repeated int32 result_formats = 5;
}

// Value is a possibly-null raw pgwire value.
message Value {
  // True when the value is SQL NULL; data is then empty.
  bool null = 1;
  // Raw bytes in the negotiated format.
  bytes data = 2;
}

// ExecutePortal is the pgwire Execute message.
message ExecutePortal {
  // Portal to run; empty for the unnamed portal.
  string portal = 1;
  // Maximum rows to return; zero means unlimited.
  int32 max_rows = 2;
}

// Describe is the pgwire Describe message.
message Describe {
  // Kind of object to describe.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STATEMENT = 1;
    KIND_PORTAL = 2;
  }
  Kind kind = 1;
  // Statement or portal name.
  string name = 2;
}

// Close is the pgwire Close message.
message Close {
  // Kind of object to close.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STATEMENT = 1;
    KIND_PORTAL = 2;
  }
  Kind kind = 1;
  // Statement or portal name.
  string name = 2;
}

// Sync is the pgwire Sync message; ends an extended-protocol batch.
message Sync {}

// CopyData carries one chunk of COPY payload in either direction.
message CopyData {
  // Raw COPY bytes.
  bytes data = 1;
}

// CopyDone marks the end of a COPY payload.
message CopyDone {}

// CopyFail aborts a COPY FROM STDIN.
message CopyFail {
  // Reason reported to the server.
  string message = 1;
}

// CancelRequest interrupts the running statement of a session.
message CancelRequest {
  // Router session whose statement is cancelled.
  string session_id = 1;
}

// CancelResponse acknowledges a cancel; delivery is best effort.
message CancelResponse {}

// ExecuteRequest is one router-originated pgwire message.
message ExecuteRequest {
  // Router session the message belongs to.
  string session_id = 1;
  // Topology fence; the pooler rejects stale generations.
  Generation generation = 2;
  // Authenticated user; sent on the first message of a session.
  UserIdentity user = 3;
  // Logical database the session executes against; sent on the first
  // message of a session. Empty falls back to the pooler's configured
  // default database.
  string database = 4;
  // Exactly one pgwire-shaped message.
  oneof message {
    SimpleQuery simple_query = 10;
    Parse parse = 11;
    Bind bind = 12;
    ExecutePortal execute = 13;
    Describe describe = 14;
    Close close = 15;
    Sync sync = 16;
    CopyData copy_data = 17;
    CopyDone copy_done = 18;
    CopyFail copy_fail = 19;
    CancelRequest cancel = 20;
  }
}

// FieldDescription describes one result column.
message FieldDescription {
  // Column name.
  string name = 1;
  // Table OID or zero.
  uint32 table_oid = 2;
  // Attribute number within the table or zero.
  int32 column_attr = 3;
  // Data type OID.
  uint32 type_oid = 4;
  // Data type size; negative for variable width.
  int32 type_size = 5;
  // Type modifier.
  int32 type_modifier = 6;
  // Format code (0 text, 1 binary).
  int32 format = 7;
}

// RowDescription mirrors pgwire RowDescription.
message RowDescription {
  repeated FieldDescription fields = 1;
}

// DataRow mirrors pgwire DataRow with raw column bytes.
message DataRow {
  repeated Value columns = 1;
}

// CommandComplete mirrors pgwire CommandComplete.
message CommandComplete {
  // Command tag such as "INSERT 0 1".
  string tag = 1;
}

// ErrorResponse mirrors pgwire ErrorResponse.
message ErrorResponse {
  Error error = 1;
}

// NoticeResponse mirrors pgwire NoticeResponse.
message NoticeResponse {
  Error notice = 1;
}

// ReadyForQuery mirrors pgwire ReadyForQuery.
message ReadyForQuery {
  // Backend transaction status.
  enum TxnStatus {
    TXN_STATUS_UNSPECIFIED = 0;
    // 'I': idle, not in a transaction.
    TXN_STATUS_IDLE = 1;
    // 'T': inside a transaction block.
    TXN_STATUS_IN_TRANSACTION = 2;
    // 'E': inside a failed transaction block.
    TXN_STATUS_FAILED = 3;
  }
  TxnStatus txn_status = 1;
}

// ParseComplete mirrors pgwire ParseComplete.
message ParseComplete {}

// BindComplete mirrors pgwire BindComplete.
message BindComplete {}

// NoData mirrors pgwire NoData.
message NoData {}

// ParameterDescription mirrors pgwire ParameterDescription.
message ParameterDescription {
  repeated uint32 param_oids = 1;
}

// CopyInResponse mirrors pgwire CopyInResponse.
message CopyInResponse {
  // Overall format (0 text, 1 binary).
  int32 format = 1;
  // Per-column formats.
  repeated int32 column_formats = 2;
}

// CopyOutResponse mirrors pgwire CopyOutResponse.
message CopyOutResponse {
  // Overall format (0 text, 1 binary).
  int32 format = 1;
  // Per-column formats.
  repeated int32 column_formats = 2;
}

// ParameterStatus mirrors pgwire ParameterStatus.
message ParameterStatus {
  string name = 1;
  string value = 2;
}

// NotificationResponse mirrors pgwire NotificationResponse (LISTEN payloads).
message NotificationResponse {
  uint32 pid = 1;
  string channel = 2;
  string payload = 3;
}

// EmptyQuery mirrors pgwire EmptyQueryResponse.
message EmptyQuery {}

// ExecuteResponse is one pooler-originated pgwire message.
message ExecuteResponse {
  // Router session the message belongs to.
  string session_id = 1;
  // Exactly one pgwire-shaped message.
  oneof message {
    RowDescription row_description = 10;
    DataRow data_row = 11;
    CommandComplete command_complete = 12;
    ErrorResponse error = 13;
    ReadyForQuery ready_for_query = 14;
    ParseComplete parse_complete = 15;
    BindComplete bind_complete = 16;
    NoData no_data = 17;
    ParameterDescription parameter_description = 18;
    CopyInResponse copy_in_response = 19;
    CopyOutResponse copy_out_response = 20;
    CopyData copy_data = 21;
    CopyDone copy_done = 22;
    NoticeResponse notice = 23;
    ParameterStatus parameter_status = 24;
    EmptyQuery empty_query = 25;
    NotificationResponse notification = 26;
  }
}

// ReserveRequest pins a backend to a session.
message ReserveRequest {
  string session_id = 1;
  Generation generation = 2;
}

// ReserveResponse reports the pinned backend.
message ReserveResponse {
  // Backend process id, usable for out-of-band cancel.
  int32 backend_pid = 1;
  // Set when no backend could be pinned.
  Error error = 2;
}

// ReleaseRequest unpins the session's backend.
message ReleaseRequest {
  string session_id = 1;
}

// ReleaseResponse acknowledges the release.
message ReleaseResponse {
  Error error = 1;
}

// HealthRequest opens a health stream.
message HealthRequest {}

// HealthStatus is a snapshot of the shard behind the pooler.
message HealthStatus {
  // Replication role of the backing PostgreSQL instance.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_PRIMARY = 1;
    ROLE_STANDBY = 2;
  }
  Role role = 1;
  // Bytes of WAL received but not yet replayed; zero on a primary.
  uint64 replay_lag_bytes = 2;
  // Primary epoch the instance serves under.
  uint64 epoch = 3;
  // Shard map generation the pooler is configured with.
  uint64 generation = 4;
  // True when the pooler accepts client traffic.
  bool serving = 5;
}

// StreamRequest opens a logical decoding stream from the shard.
message StreamRequest {
  // Replication slot to consume; derived from stream when empty.
  string slot = 1;
  // Publication to decode; pgshard_all when empty.
  string publication = 2;
  // LSN to start from; zero resumes from the slot's confirmed position.
  uint64 start_lsn = 3;
  // Extra pgoutput options; proto_version, publication_names, streaming and
  // messages are fixed by the pooler, two_phase defaults to off.
  map<string, string> options = 4;
  // Change stream whose slot pgshard_<stream>_<shard> is consumed.
  string stream = 5;
  // Database the slot decodes.
  string database = 6;
  // Flush a batch once it holds this many bytes of tuple data; zero means
  // one batch per transaction (64 KiB cap).
  uint32 batch_bytes = 7;
}

// AckRequest confirms events up to lsn for a slot.
message AckRequest {
  // Slot to advance; derived from stream when empty.
  string slot = 1;
  string stream = 2;
  // Highest end position processed by the consumer.
  uint64 lsn = 3;
}

// AckResponse reports the outcome.
message AckResponse {
  Error error = 1;
}

// CopyTablesRequest starts or resumes the initial copy of a shard.
message CopyTablesRequest {
  // Change stream whose slot pgshard_<stream>_<shard> is created with the
  // exported snapshot when missing.
  string stream = 1;
  // Database to copy.
  string database = 2;
  // Publication whose tables are copied; pgshard_all when empty.
  string publication = 3;
  // Create the stream slot with two_phase when it has to be created.
  bool two_phase = 4;
  // Rows per batch; zero means 1000.
  uint32 batch_rows = 5;
  // Tables already copied (schema.table), skipped.
  repeated string done_tables = 6;
  // Table to continue after its last delivered key; empty starts with the
  // first table not done.
  string resume_schema = 7;
  string resume_table = 8;
  // Last key delivered for the resumed table, as sent in Rows.lastpk.
  bytes resume_lastpk = 9;
}

// CopyTablesResponse is one message of the copy.
message CopyTablesResponse {
  // Snapshot reports the slot and the consistent point the snapshot was
  // exported at; it is the first message.
  message Snapshot {
    string slot = 1;
    // True when the stream's own slot was created for this snapshot;
    // false when a temporary slot was used because it already existed.
    bool stream_slot = 2;
    uint64 consistent_point = 3;
    string snapshot_name = 4;
  }
  // TableBegin precedes the rows of one table and describes its columns;
  // key marks the primary key columns (none for a table copied by ctid).
  message TableBegin {
    ChangeEvent.Relation relation = 1;
    // True when the table has no primary key and is walked by ctid.
    bool by_ctid = 2;
  }
  // Row is one copied row in text format.
  message Row {
    repeated Value values = 1;
  }
  // Rows is one batch of a table; lastpk is the checkpoint after it.
  message Rows {
    repeated Row rows = 1;
    bytes lastpk = 2;
  }
  // TableDone closes a table.
  message TableDone {
    string schema = 1;
    string table = 2;
  }
  // Done closes the copy once every table was sent.
  message Done {}
  oneof response {
    Snapshot snapshot = 1;
    TableBegin table_begin = 2;
    Rows rows = 3;
    TableDone table_done = 4;
    Done done = 5;
  }
}

// ChangeBatch groups consecutive events of one slot.
message ChangeBatch {
  repeated ChangeEvent events = 1;
  // End position of the last WAL record in the batch; acknowledgeable
  // once the batch is processed.
  uint64 end_lsn = 2;
}

// ChangeEvent is one decoded logical replication message.
message ChangeEvent {
  // Transaction begins.
  message Begin {
    uint32 xid = 1;
    uint64 final_lsn = 2;
    // Commit timestamp in microseconds since 2000-01-01 UTC.
    int64 commit_ts = 3;
  }
  // One changed row.
  message Row {
    // Row change kind.
    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_INSERT = 1;
      KIND_UPDATE = 2;
      KIND_DELETE = 3;
      KIND_TRUNCATE = 4;
    }
    string schema = 1;
    string table = 2;
    Kind kind = 3;
    // Old tuple, when replica identity provides it.
    repeated Value old = 4;
    // New tuple.
    repeated Value new = 5;
    uint32 relation_id = 6;
    // True when old carries the key columns only (pgoutput 'K'), false for
    // a full old image ('O').
    bool old_is_key = 7;
    // Columns of new (same order) whose value is an unchanged TOAST datum
    // that pgoutput did not send; the entry in new is empty, not null.
    repeated uint32 unchanged_toast = 8;
  }
  // Transaction commits.
  message Commit {
    uint64 commit_lsn = 1;
    uint64 end_lsn = 2;
  }
  // Keepalive; carries the server's current WAL position.
  message Keepalive {
    uint64 wal_end = 1;
    // True when the server wants a reply now.
    bool reply_requested = 2;
  }
  // Two-phase PREPARE TRANSACTION.
  message Prepare {
    string gid = 1;
    uint64 prepare_lsn = 2;
    uint64 end_lsn = 3;
  }
  // COMMIT PREPARED of an earlier Prepare.
  message CommitPrepared {
    string gid = 1;
    uint64 commit_lsn = 2;
    uint64 end_lsn = 3;
  }
  // ROLLBACK PREPARED of an earlier Prepare.
  message RollbackPrepared {
    string gid = 1;
    uint64 rollback_lsn = 2;
    uint64 end_lsn = 3;
  }
  // Logical decoding message (pg_logical_emit_message).
  message Message {
    string prefix = 1;
    bytes content = 2;
    bool transactional = 3;
  }
  // Relation describes a table before its first change in the stream and
  // again after its columns change.
  message Relation {
    // Column of a relation.
    message Column {
      string name = 1;
      uint32 type_oid = 2;
      int32 type_modifier = 3;
      // True when the column is part of the replica identity.
      bool key = 4;
    }
    uint32 relation_id = 1;
    string schema = 2;
    string table = 3;
    // Replica identity: d default, n nothing, f full, i index.
    string replica_identity = 4;
    repeated Column columns = 5;
  }
  // Truncate of one or more tables.
  message Truncate {
    repeated uint32 relation_ids = 1;
    bool cascade = 2;
    bool restart_identity = 3;
  }
  // StreamStart opens a segment of an in-progress (streamed) transaction.
  message StreamStart {
    uint32 xid = 1;
    bool first_segment = 2;
  }
  // StreamStop closes a streamed segment.
  message StreamStop {}
  // StreamCommit commits a streamed transaction.
  message StreamCommit {
    uint32 xid = 1;
    uint64 commit_lsn = 2;
    uint64 end_lsn = 3;
    // Commit timestamp in microseconds since 2000-01-01 UTC.
    int64 commit_ts = 4;
  }
  // StreamAbort aborts a streamed transaction or subtransaction.
  message StreamAbort {
    uint32 xid = 1;
    uint32 subxid = 2;
    uint64 abort_lsn = 3;
  }
  // BeginPrepare opens a two-phase transaction.
  message BeginPrepare {
    string gid = 1;
    uint32 xid = 2;
    uint64 prepare_lsn = 3;
    // Prepare timestamp in microseconds since 2000-01-01 UTC.
    int64 prepare_ts = 4;
  }
  // StreamPrepare prepares a streamed transaction.
  message StreamPrepare {
    string gid = 1;
    uint32 xid = 2;
    uint64 prepare_lsn = 3;
    uint64 end_lsn = 4;
    // Prepare timestamp in microseconds since 2000-01-01 UTC.
    int64 prepare_ts = 5;
  }
  // Origin names the replication origin of the transaction.
  message Origin {
    string name = 1;
    uint64 commit_lsn = 2;
  }
  // WAL position of the event.
  uint64 lsn = 1;
  // Transaction id; set for every event of a streamed transaction and for
  // Begin/Prepare-style events.
  uint32 xid = 2;
  oneof event {
    Begin begin = 10;
    Row row = 11;
    Commit commit = 12;
    Keepalive keepalive = 13;
    Prepare prepare = 14;
    CommitPrepared commit_prepared = 15;
    RollbackPrepared rollback_prepared = 16;
    Message message = 17;
    Relation relation = 18;
    Truncate truncate = 19;
    StreamStart stream_start = 20;
    StreamStop stream_stop = 21;
    StreamCommit stream_commit = 22;
    StreamAbort stream_abort = 23;
    BeginPrepare begin_prepare = 24;
    StreamPrepare stream_prepare = 25;
    Origin origin = 26;
  }
}
