// Operator to controller contract: long-running workflows and DDL.
syntax = "proto3";

package pgshard.v1;

import "pgshard/v1/common.proto";

option go_package = "github.com/andrew01234567890/pgshard/internal/gen/pgshard/v1;pgshardv1";

// Controller owns cluster-wide workflows such as resharding and DDL migration.
service Controller {
  // ListWorkflows lists workflows, optionally filtered by kind and state.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // GetWorkflow returns one workflow.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  // PauseWorkflow suspends a running workflow at its next safe point.
  rpc PauseWorkflow(PauseWorkflowRequest) returns (PauseWorkflowResponse);
  // ResumeWorkflow continues a paused workflow.
  rpc ResumeWorkflow(ResumeWorkflowRequest) returns (ResumeWorkflowResponse);
  // CancelWorkflow ends a workflow that has not started. A pending or
  // paused one has claimed nothing and copied nothing, so it can simply be
  // abandoned; a running one has to be unwound, which is its own operation.
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  // ResolveTransactions triggers a resolution pass over in-doubt
  // distributed transactions.
  rpc ResolveTransactions(ResolveTransactionsRequest) returns (ResolveTransactionsResponse);
  // ApplyDDL starts a DDL migration and streams per-shard progress.
  //
  // NOT IMPLEMENTED: the server has no handler for this and answers
  // UNIMPLEMENTED. It is declared because the shape is settled and the
  // applier it would drive exists; wiring it up is PGS-489. Said here
  // because this file is what clients are generated from, and a method
  // that only fails when called is worse to discover at run time.
  rpc ApplyDDL(ApplyDDLRequest) returns (stream ApplyDDLResponse);
  // CreateBarrier pauses writes, drains two-phase commits, creates a named
  // restore point on every group and records a certified restore point.
  rpc CreateBarrier(CreateBarrierRequest) returns (CreateBarrierResponse);
  // ListBarriers lists recorded restore points, newest first.
  rpc ListBarriers(ListBarriersRequest) returns (ListBarriersResponse);
  // ListRoleStatus reports, per managed role and group, whether the group
  // matches the catalog's desired role state.
  rpc ListRoleStatus(ListRoleStatusRequest) returns (ListRoleStatusResponse);
  // CreateStream registers a change stream and creates its failover slot
  // on every shard of the stream's shard set.
  rpc CreateStream(CreateStreamRequest) returns (CreateStreamResponse);
  // DropStream drops a change stream's slots and its catalog rows.
  rpc DropStream(DropStreamRequest) returns (DropStreamResponse);
}

// WorkflowKind enumerates workflow types.
enum WorkflowKind {
  WORKFLOW_KIND_UNSPECIFIED = 0;
  // Split or merge shards.
  WORKFLOW_KIND_RESHARD = 1;
  // Change the sharding key of a table.
  WORKFLOW_KIND_REKEY = 2;
  // Major-version PostgreSQL upgrade.
  WORKFLOW_KIND_UPGRADE = 3;
  // Online schema change.
  WORKFLOW_KIND_DDL_MIGRATION = 4;
}

// WorkflowState enumerates workflow lifecycle states.
enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_PENDING = 1;
  WORKFLOW_STATE_RUNNING = 2;
  WORKFLOW_STATE_PAUSED = 3;
  WORKFLOW_STATE_COMPLETED = 4;
  WORKFLOW_STATE_FAILED = 5;
  WORKFLOW_STATE_CANCELLED = 6;
}

// Workflow is a long-running controller operation.
message Workflow {
  string id = 1;
  WorkflowKind kind = 2;
  WorkflowState state = 3;
  // Human-readable progress or failure description.
  string message = 4;
  // Shards touched by the workflow.
  repeated ShardRef shards = 5;
  Error error = 6;
}

// ListWorkflowsRequest filters workflows.
message ListWorkflowsRequest {
  // Zero value means any kind.
  WorkflowKind kind = 1;
  // Zero value means any state.
  WorkflowState state = 2;
}

// ListWorkflowsResponse returns matching workflows.
message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
}

// GetWorkflowRequest names a workflow.
message GetWorkflowRequest {
  string id = 1;
}

// GetWorkflowResponse returns the workflow.
message GetWorkflowResponse {
  Workflow workflow = 1;
}

// PauseWorkflowRequest names a workflow to pause.
message PauseWorkflowRequest {
  string id = 1;
}

// PauseWorkflowResponse returns the workflow after the request.
message PauseWorkflowResponse {
  Workflow workflow = 1;
}

// CancelWorkflowRequest names the workflow to abandon.
message CancelWorkflowRequest {
  string id = 1;
}

// CancelWorkflowResponse returns the workflow after the request.
message CancelWorkflowResponse {
  Workflow workflow = 1;
}

// ResumeWorkflowRequest names a workflow to resume.
message ResumeWorkflowRequest {
  string id = 1;
}

// ResumeWorkflowResponse returns the workflow after the request.
message ResumeWorkflowResponse {
  Workflow workflow = 1;
}

// ResolveTransactionsRequest triggers resolution, optionally for one shard set.
message ResolveTransactionsRequest {
  // Empty means all shard sets.
  string shard_set = 1;
}

// ResolveTransactionsResponse counts the outcomes of the pass.
message ResolveTransactionsResponse {
  uint32 committed = 1;
  uint32 rolled_back = 2;
  // Transactions still in doubt after the pass.
  uint32 unresolved = 3;
  Error error = 4;
}

// ApplyDDLRequest starts a DDL migration.
message ApplyDDLRequest {
  // Target database.
  string database = 1;
  // DDL statement to apply on every shard.
  string statement = 2;
  // True returns after the migration is registered; false streams to completion.
  bool async = 3;
}

// ShardDDLState is the migration state on one shard.
message ShardDDLState {
  // Per-shard migration state.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED = 1;
    STATE_RUNNING = 2;
    STATE_COMPLETED = 3;
    STATE_FAILED = 4;
  }
  ShardRef shard = 1;
  State state = 2;
  Error error = 3;
}

// ApplyDDLResponse is the first message with the migration id, then per-shard
// state updates until the stream ends.
message ApplyDDLResponse {
  string migration_id = 1;
  ShardDDLState shard_state = 2;
}

// CreateBarrierRequest names the barrier; the restore point on every group
// is "pgshard-<name>".
message CreateBarrierRequest {
  string name = 1;
}

// GroupRestorePoint is where one group's restore point landed.
message GroupRestorePoint {
  string group = 1;
  uint64 lsn = 2;
  int64 timeline = 3;
  string wal_segment = 4;
}

// Barrier is one recorded restore point.
message Barrier {
  string id = 1;
  string name = 2;
  // Restore point name to recover every group to.
  string restore_point = 3;
  int64 shard_map_generation = 4;
  // Certified means writes were paused and two-phase commits drained when
  // the restore points were created, so restoring every group to it is
  // cluster-consistent.
  bool certified = 5;
  repeated GroupRestorePoint groups = 6;
  // Unix seconds.
  int64 created_at = 7;
}

// CreateBarrierResponse returns the recorded barrier.
message CreateBarrierResponse {
  Barrier barrier = 1;
  Error error = 2;
}

// ListBarriersRequest lists barriers.
message ListBarriersRequest {
  // True returns only certified barriers.
  bool certified_only = 1;
}

// ListBarriersResponse returns barriers, newest first.
message ListBarriersResponse {
  repeated Barrier barriers = 1;
}

// RoleStatus is the drift state of one role on one group.
message RoleStatus {
  // Drift state of a role on a group.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The group matches the desired role.
    STATE_IN_SYNC = 1;
    // Attributes, verifier, memberships or grants differ; details say what.
    STATE_DRIFTED = 2;
    // The role does not exist on the group.
    STATE_MISSING = 3;
    // The role exists on the group but is not in pgshard.roles; left alone.
    STATE_UNMANAGED = 4;
  }
  string role = 1;
  // Group name: "<shard set>/<shard id>" or "catalog".
  string group = 2;
  State state = 3;
  // JSON object with the differences found and repair outcome.
  string details_json = 4;
  // Desired-state generation the group was last materialized at.
  int64 roles_generation = 5;
  // Unix seconds of the last check.
  int64 checked_at_unix = 6;
}

// ListRoleStatusRequest filters role status rows.
message ListRoleStatusRequest {
  // Empty means every role.
  string role = 1;
}

// ListRoleStatusResponse lists role status rows ordered by role and group.
message ListRoleStatusResponse {
  repeated RoleStatus statuses = 1;
}

// CreateStreamRequest registers a change stream.
message CreateStreamRequest {
  // Stream name: [a-z][a-z0-9_]{0,31}.
  string stream = 1;
  // Logical database the slots decode.
  string database = 2;
  bool two_phase = 3;
  // Shard set whose shards get a slot; empty means default.
  string shard_set = 4;
}

// CreateStreamResponse reports the slot of every shard.
message CreateStreamResponse {
  // Slot created on one shard.
  message Slot {
    ShardRef shard = 1;
    string slot = 2;
    // LSN the slot starts at.
    uint64 lsn = 3;
  }
  repeated Slot slots = 1;
  Error error = 2;
}

// DropStreamRequest drops a change stream.
message DropStreamRequest {
  string stream = 1;
}

// DropStreamResponse reports the outcome.
message DropStreamResponse {
  Error error = 1;
}
