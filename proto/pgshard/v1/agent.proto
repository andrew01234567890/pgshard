// Control plane to per-instance agent contract.
syntax = "proto3";

package pgshard.v1;

import "pgshard/v1/common.proto";

option go_package = "github.com/andrew01234567890/pgshard/internal/gen/pgshard/v1;pgshardv1";

// Agent runs next to one PostgreSQL instance and applies lifecycle commands.
//
// Epoch fencing: role changes (Promote, Demote) carry a new epoch and are
// accepted only when it is strictly greater than the last accepted epoch; the
// agent persists the new epoch before acting. All other mutating commands
// (Rewind, Reclone, Reload, Restart, CreateRestorePoint, slot and backup
// operations) carry the caller's view of the current epoch and are accepted
// only when it EQUALS the last accepted epoch, so a stale controller is fenced
// while same-term operations and idempotent retries remain possible.
// Read-only commands (Status, ListSlots, RestoreInfo) are not fenced.
service Agent {
  // Status reports role, epoch and replication position. Read-only.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Promote makes a standby the primary under the given epoch.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Demote turns a primary into a standby of the current lease holder.
  rpc Demote(DemoteRequest) returns (DemoteResponse);
  // Rewind runs pg_rewind against a source so a former primary can follow it.
  rpc Rewind(RewindRequest) returns (RewindResponse);
  // Reclone rebuilds the data directory from a source or backup.
  rpc Reclone(RecloneRequest) returns (RecloneResponse);
  // Reload signals the instance to reread its configuration.
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  // Restart stops and starts the instance.
  rpc Restart(RestartRequest) returns (RestartResponse);
  // CreateRestorePoint creates a named WAL restore point.
  rpc CreateRestorePoint(CreateRestorePointRequest) returns (CreateRestorePointResponse);
  // CreateSlot creates a replication slot.
  rpc CreateSlot(CreateSlotRequest) returns (CreateSlotResponse);
  // DropSlot drops a replication slot.
  rpc DropSlot(DropSlotRequest) returns (DropSlotResponse);
  // ListSlots lists replication slots. Read-only.
  rpc ListSlots(ListSlotsRequest) returns (ListSlotsResponse);
  // CreateStreamSlot creates the failover-enabled pgoutput slot of a change
  // stream on this shard, creating the FOR ALL TABLES publication if needed.
  rpc CreateStreamSlot(CreateStreamSlotRequest) returns (CreateStreamSlotResponse);
  // DropStreamSlot drops the slot of a change stream on this shard.
  rpc DropStreamSlot(DropStreamSlotRequest) returns (DropStreamSlotResponse);
  // SetSynchronizedStandbySlots sets synchronized_standby_slots to the
  // given physical slots, keeping only those that exist and are active.
  rpc SetSynchronizedStandbySlots(SetSynchronizedStandbySlotsRequest) returns (SetSynchronizedStandbySlotsResponse);
  // Backup takes a base or incremental backup.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // RestoreInfo reports the backup repository contents. Read-only.
  rpc RestoreInfo(RestoreInfoRequest) returns (RestoreInfoResponse);
  // Expire applies the retention policy to the backup repository.
  rpc Expire(ExpireRequest) returns (ExpireResponse);
  // Verify checks the backup repository for corruption. Read-only.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // ListTransactionDecisions reads the two-phase commit decision log of the
  // pgshard catalog this instance serves. Read-only.
  rpc ListTransactionDecisions(ListTransactionDecisionsRequest) returns (ListTransactionDecisionsResponse);
  // ListPreparedTransactions lists the router-coordinated prepared
  // transactions this instance still holds. Read-only.
  rpc ListPreparedTransactions(ListPreparedTransactionsRequest) returns (ListPreparedTransactionsResponse);
  // ReconcilePreparedTransactions finishes prepared transactions on this
  // instance against a decision log: commit-decided ones are committed,
  // every other one rolled back, and commit-decided transactions that are
  // neither prepared nor committed are reported as contradictions.
  rpc ReconcilePreparedTransactions(ReconcilePreparedTransactionsRequest) returns (ReconcilePreparedTransactionsResponse);
  // SetWriteFence raises or releases the cluster write fence in the pgshard
  // catalog this instance serves.
  rpc SetWriteFence(SetWriteFenceRequest) returns (SetWriteFenceResponse);
  // MaterializeSchema copies the schema of one database from a source
  // (pg_dump --schema-only piped into psql) into the same-named local
  // database, which must already exist and be empty.
  rpc MaterializeSchema(MaterializeSchemaRequest) returns (MaterializeSchemaResponse);
}

// StatusRequest asks for the instance status.
message StatusRequest {}

// StatusResponse describes the instance.
message StatusResponse {
  // Instance role.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_PRIMARY = 1;
    ROLE_STANDBY = 2;
  }
  Role role = 1;
  // Last accepted epoch.
  uint64 epoch = 2;
  // Current write LSN on a primary or replay LSN on a standby.
  uint64 lsn = 3;
  // Current timeline id.
  uint32 timeline = 4;
  // True when PostgreSQL accepts connections.
  bool running = 5;
  Error error = 6;
  // True while a promotion has run pg_ctl promote but not yet finished its
  // post-promotion setup; the operator re-issues Promote to complete it.
  bool promotion_pending = 7;
  // Build is the agent's version metadata. During a rolling upgrade the
  // members of one cluster run different binaries for a while, and
  // nothing in this response said which -- so neither an operator
  // watching the roll nor a caller deciding whether an optional RPC
  // exists could tell. Empty from an agent that predates the field,
  // which is itself the answer "older than this".
  string build = 8;
}

// PromoteRequest promotes the instance.
message PromoteRequest {
  // Fencing epoch; must exceed the last accepted epoch.
  uint64 epoch = 1;
  // Identity of the lease holder authorising the promotion.
  string lease_holder = 2;
}

// PromoteResponse reports the outcome.
message PromoteResponse {
  uint64 epoch = 1;
  // Timeline id after promotion.
  uint32 timeline = 2;
  Error error = 3;
}

// DemoteRequest demotes the instance.
message DemoteRequest {
  // Fencing epoch; must exceed the last accepted epoch.
  uint64 epoch = 1;
}

// DemoteResponse reports the outcome.
message DemoteResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// RewindRequest rewinds the instance to follow a source.
message RewindRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  // Connection string of the source to rewind against.
  string source = 2;
}

// RewindResponse reports the outcome.
message RewindResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// RecloneRequest rebuilds the data directory.
message RecloneRequest {
  // Where the clone comes from.
  enum SourceKind {
    SOURCE_KIND_UNSPECIFIED = 0;
    // pg_basebackup from a live instance.
    SOURCE_KIND_PRIMARY = 1;
    // Restore from a backup repository.
    SOURCE_KIND_BACKUP = 2;
  }
  uint64 epoch = 1;
  SourceKind source_kind = 2;
  // Backup identifier when source_kind is BACKUP.
  string backup_ref = 3;
}

// RecloneResponse reports the outcome.
message RecloneResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// ReloadRequest reloads configuration.
message ReloadRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
}

// ReloadResponse reports the outcome.
message ReloadResponse {
  uint64 epoch = 1;
  Error error = 2;
  // settings_hash identifies the configuration the agent applied, as
  // published by the operator in the agent config.
  string settings_hash = 3;
}

// RestartRequest restarts the instance.
message RestartRequest {
  // Shutdown mode passed to pg_ctl.
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SMART = 1;
    MODE_FAST = 2;
    MODE_IMMEDIATE = 3;
  }
  uint64 epoch = 1;
  Mode mode = 2;
}

// RestartResponse reports the outcome.
message RestartResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// CreateRestorePointRequest creates a named restore point.
message CreateRestorePointRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  string name = 2;
}

// CreateRestorePointResponse reports the restore point LSN.
message CreateRestorePointResponse {
  uint64 epoch = 1;
  uint64 lsn = 2;
  Error error = 3;
}

// SlotKind distinguishes physical from logical slots.
enum SlotKind {
  SLOT_KIND_UNSPECIFIED = 0;
  SLOT_KIND_PHYSICAL = 1;
  SLOT_KIND_LOGICAL = 2;
}

// CreateSlotRequest creates a replication slot.
message CreateSlotRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  string name = 2;
  SlotKind kind = 3;
  // Logical output plugin; ignored for physical slots.
  string plugin = 4;
  // True to synchronise the slot to standbys for failover.
  bool failover = 5;
}

// CreateSlotResponse reports the slot's confirmed LSN.
message CreateSlotResponse {
  uint64 epoch = 1;
  uint64 lsn = 2;
  Error error = 3;
}

// DropSlotRequest drops a replication slot.
message DropSlotRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  string name = 2;
}

// DropSlotResponse reports the outcome.
message DropSlotResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// ListSlotsRequest lists replication slots.
message ListSlotsRequest {}

// Slot describes one replication slot.
message Slot {
  string name = 1;
  SlotKind kind = 2;
  string plugin = 3;
  bool failover = 4;
  bool active = 5;
  uint64 restart_lsn = 6;
  uint64 confirmed_flush_lsn = 7;
  // pg_replication_slots.wal_status: reserved, extended, unreserved or lost.
  string wal_status = 8;
  // pg_replication_slots.invalidation_reason; empty while valid.
  string invalidation_reason = 9;
  // True on a standby when the slot was synchronized from the primary.
  bool synced = 10;
  bool temporary = 11;
  bool two_phase = 12;
  // Database the logical slot belongs to; empty for physical slots.
  string database = 13;
}

// CreateStreamSlotRequest creates a change stream's slot on this shard.
message CreateStreamSlotRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  // Stream name; the slot is named pgshard_<stream>_<shard>.
  string stream = 2;
  // Database the stream decodes.
  string database = 3;
  // Enable two-phase decoding for the slot.
  bool two_phase = 4;
}

// CreateStreamSlotResponse reports the created slot.
message CreateStreamSlotResponse {
  uint64 epoch = 1;
  string slot = 2;
  // Consistent point the slot starts from.
  uint64 lsn = 3;
  Error error = 4;
}

// DropStreamSlotRequest drops a change stream's slot on this shard.
message DropStreamSlotRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  string stream = 2;
}

// DropStreamSlotResponse reports the outcome.
message DropStreamSlotResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// SetSynchronizedStandbySlotsRequest names the physical slots of the
// synchronous standbys whose confirmation failover slots must wait for.
message SetSynchronizedStandbySlotsRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  repeated string slots = 2;
}

// SetSynchronizedStandbySlotsResponse reports the slots actually applied.
message SetSynchronizedStandbySlotsResponse {
  uint64 epoch = 1;
  // Subset of the requested slots that exist and are active.
  repeated string applied = 2;
  Error error = 3;
}

// ListSlotsResponse returns the slots.
message ListSlotsResponse {
  uint64 epoch = 1;
  repeated Slot slots = 2;
  Error error = 3;
}

// BackupRequest takes a backup.
message BackupRequest {
  // Backup type.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_FULL = 1;
    TYPE_DIFF = 2;
    TYPE_INCR = 3;
  }
  uint64 epoch = 1;
  Type type = 2;
}

// BackupInfo describes one backup set in the repository.
message BackupInfo {
  // pgBackRest backup label, e.g. 20260101-120000F.
  string label = 1;
  // full, diff or incr.
  string type = 2;
  uint64 start_lsn = 3;
  uint64 stop_lsn = 4;
  // First and last WAL segment the backup needs.
  string archive_start = 5;
  string archive_stop = 6;
  // Database size and the size stored in the repository (bytes).
  uint64 size_bytes = 7;
  uint64 repo_size_bytes = 8;
  // Unix seconds.
  int64 started_at = 9;
  int64 finished_at = 10;
  // Prior backup this one depends on; empty for a full backup.
  string prior = 11;
}

// BackupResponse reports the backup reference.
message BackupResponse {
  uint64 epoch = 1;
  // Identifier usable as RecloneRequest.backup_ref.
  string backup_ref = 2;
  Error error = 3;
  BackupInfo info = 4;
  // Tail of the pgbackrest console log.
  repeated string log = 5;
}

// RestoreInfoRequest asks for the repository contents.
message RestoreInfoRequest {}

// RestoreInfoResponse describes the stanza in the repository.
message RestoreInfoResponse {
  uint64 epoch = 1;
  // Backup the data directory was restored from; empty if never restored.
  string backup_ref = 2;
  // LSN at which recovery ended.
  uint64 recovery_end_lsn = 3;
  Error error = 4;
  string stanza = 5;
  // pgBackRest stanza status code and message (0 = ok).
  int64 status_code = 6;
  string status_message = 7;
  // Oldest and newest archived WAL segment.
  string archive_min = 8;
  string archive_max = 9;
  repeated BackupInfo backups = 10;
}

// ExpireRequest applies retention.
message ExpireRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
}

// ExpireResponse reports the outcome.
message ExpireResponse {
  uint64 epoch = 1;
  Error error = 2;
  repeated string log = 3;
}

// VerifyRequest checks the repository.
message VerifyRequest {}

// VerifyResponse reports the outcome.
message VerifyResponse {
  uint64 epoch = 1;
  Error error = 2;
  repeated string log = 3;
}

// TransactionDecision is one row of the decision log.
message TransactionDecision {
  string gid = 1;
  // preparing, commit or abort.
  string state = 2;
  // Participant shard ids and, in the same order, their transaction ids.
  repeated int32 participants = 3;
  repeated string participant_xids = 4;
}

// ListTransactionDecisionsRequest reads the decision log.
message ListTransactionDecisionsRequest {}

// ListTransactionDecisionsResponse returns the decision log.
message ListTransactionDecisionsResponse {
  uint64 epoch = 1;
  repeated TransactionDecision decisions = 2;
  Error error = 3;
}

// ListPreparedTransactionsRequest lists the pgshard prepared transactions.
message ListPreparedTransactionsRequest {}

// PreparedTransaction is one pgshard prepared transaction on this instance.
message PreparedTransaction {
  string gid = 1;
  // Database the transaction was prepared in.
  string database = 2;
}

// ListPreparedTransactionsResponse returns the prepared transactions.
message ListPreparedTransactionsResponse {
  uint64 epoch = 1;
  repeated PreparedTransaction prepared = 2;
  Error error = 3;
}

// ReconcilePreparedTransactionsRequest carries the decision log to apply.
message ReconcilePreparedTransactionsRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  repeated TransactionDecision decisions = 2;
  // Shard id of this instance in the decision log's participant lists.
  int32 shard_id = 3;
}

// ReconcilePreparedTransactionsResponse reports the outcome.
message ReconcilePreparedTransactionsResponse {
  uint64 epoch = 1;
  uint32 committed = 2;
  uint32 rolled_back = 3;
  // Commit-decided gids that are neither prepared nor committed here.
  repeated string contradictions = 4;
  Error error = 5;
  // Commit-decided gids that are not prepared here and whose recorded
  // transaction id no longer resolves (frozen, unrecorded or in the
  // future), so the commit cannot be verified.
  repeated string unverifiable = 6;
}

// SetWriteFenceRequest raises (active) or releases the fence.
message SetWriteFenceRequest {
  // Caller's view of the current epoch; must EQUAL the last accepted epoch.
  uint64 epoch = 1;
  bool active = 2;
  string reason = 3;
}

// SetWriteFenceResponse reports the outcome.
message SetWriteFenceResponse {
  uint64 epoch = 1;
  Error error = 2;
}

// MaterializeSchemaRequest names the source and the database to copy.
message MaterializeSchemaRequest {
  // libpq connection string of the source database.
  string source_conninfo = 1;
  // Database name on both sides.
  string database = 2;
  // Epoch the caller believes this member is serving at, as every other
  // mutating call carries. A copy can outlive a failover of its target, so
  // without it the schema can land on a member that stopped being the
  // primary while it ran. Optional on the wire so that an absent epoch is
  // distinguishable from epoch zero, and refused rather than assumed.
  optional uint64 epoch = 3;
}

// MaterializeSchemaResponse reports the outcome.
message MaterializeSchemaResponse {
  Error error = 1;
  // Epoch the member is serving at now.
  uint64 epoch = 2;
}
