// Shared identifiers and value types used by every pgshard service.
syntax = "proto3";

package pgshard.v1;

option go_package = "github.com/andrew01234567890/pgshard/internal/gen/pgshard/v1;pgshardv1";

// ShardRef identifies one shard within a shard set.
message ShardRef {
  // Name of the shard set (a group of shards sharing one key space).
  string shard_set = 1;
  // Identifier of the shard within the shard set.
  uint32 shard_id = 2;
}

// Generation fences a request against the cluster topology it was planned for.
// A server rejects requests whose generation is older than what it serves.
message Generation {
  // Monotonic version of the shard map (key range to shard assignment).
  uint64 shard_map_generation = 1;
  // Monotonic epoch of the primary serving the target shard; bumps on every promotion.
  uint64 primary_epoch = 2;
}

// Position is a consistent point across shards, expressed as a per-shard LSN
// plus the shard map generation the LSNs were captured under.
message Position {
  // Shard id to WAL LSN (PostgreSQL XLogRecPtr as an unsigned 64-bit integer).
  map<uint32, uint64> shard_lsn = 1;
  // Shard map generation in effect when the LSNs were captured.
  uint64 shard_map_generation = 2;
}

// Error mirrors the PostgreSQL error fields a client is expected to see.
message Error {
  // Five-character SQLSTATE code.
  string sqlstate = 1;
  // Primary human-readable message.
  string message = 2;
  // Optional secondary detail.
  string detail = 3;
  // Optional hint on how to resolve the error.
  string hint = 4;
  // Why, where the SQLSTATE cannot say. 55000 is answered for a stale
  // routing generation and for a rewrite in progress, so a caller reading
  // the code alone cannot tell a topology that moved from a condition that
  // retrying will not fix. UNSPECIFIED means the sender predates this
  // field, and a reader must fall back to the SQLSTATE.
  Reason reason = 5;
}

// Reason distinguishes conditions that share a SQLSTATE.
enum Reason {
  REASON_UNSPECIFIED = 0;
  // The request carried a shard-map generation or epoch the pooler has
  // moved past; the caller should reload and retry.
  REASON_STALE_GENERATION = 1;
  // A table is mid online-rewrite and its column list is not published;
  // the caller should wait rather than treat it as a fault.
  REASON_REWRITE_IN_PROGRESS = 2;
  // The error came from the PostgreSQL backend, relayed unchanged. It is
  // NOT the pooler refusing, whatever its SQLSTATE says.
  //
  // 55000 is object_not_in_prerequisite_state, which the pooler uses for
  // every fencing refusal and which PostgreSQL itself answers for the
  // placement-fence trigger, REFRESH MATERIALIZED VIEW CONCURRENTLY without
  // a unique index, ALTER TABLE ... DETACH PARTITION FINALIZE and more. A
  // router that reads the code alone takes all of them for a topology
  // change: inside a transaction that becomes 40001 "retry the
  // transaction", the client retries, and it loops on an error retrying
  // cannot fix.
  //
  // The pooler is the only party that knows which of the two it is, because
  // it either refused the request itself or relayed an answer.
  REASON_BACKEND_ERROR = 3;
}

// KeyRange is a closed interval of hashed shard keys, [start, end], over the
// full signed 64-bit key space. Bounds are inclusive so that the whole space
// [MinInt64, MaxInt64] and its top range are representable; the catalog stores
// the same ranges as int8range with an unbounded upper bound, which maps to
// end = MaxInt64.
message KeyRange {
  // Inclusive lower bound.
  int64 start = 1;
  // Inclusive upper bound.
  int64 end = 2;
}

// StaleEpoch is attached as a gRPC status detail to a FailedPrecondition
// from an agent whose epoch does not match the caller's.
//
// It exists because the refusal used to arrive in the response body, where
// the response also carried the agent's current epoch: a caller could see
// what it should have sent without a second round trip. Moving the failure
// to a status code would have dropped that, so it moves with it.
message StaleEpoch {
  // The epoch the agent has actually accepted.
  uint64 current = 1;
}
