title = "pgshard gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and documentation hosts"
regexes = [
  '''REPLACE_ME''',
  '''CHANGE_ME''',
  '''example\.com''',
  '''example\.org''',
  # SCRAM protocol strings and test vectors (mechanism names, channel-binding
  # headers, RFC 7677 vectors) are not credentials.
  '''SCRAM-SHA-256''',
  '''p=tls-server-end-point''',
  # The operator's bootstrap-role tests need a password to seed and then
  # read back; this is the literal they use, not a credential of anything.
  '''s3cret-generated-by-the-operator''',
  # Azurite's published development account key (public emulator constant).
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]
paths = [
  '''go\.sum$''',
  # The vendored parser used to be excepted whole, so a credential committed
  # anywhere under third_party/libpg_query would not have been reported. What
  # actually trips the scanner there is four xxHash mixing constants in one
  # upstream header, so that one file is excepted and the other 622 are
  # scanned. hack/pgparser/verify.sh is what keeps the rest of the directory
  # honest about being upstream's bytes.
  '''third_party/libpg_query/[0-9]+/include/xxhash/xxhash\.h$''',
]
