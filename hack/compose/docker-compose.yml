# Local development stack: catalog + 3 shard PostgreSQL instances and object-store emulators.
#
# PG_IMAGE defaults to the project image; if it is not published yet, run with
#   PG_IMAGE=postgres:18 docker compose -f hack/compose/docker-compose.yml up
services:
  catalog:
    image: ${PG_IMAGE:-ghcr.io/andrew01234567890/pgshard-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    healthcheck: &pghealth
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  shard0:
    image: ${PG_IMAGE:-ghcr.io/andrew01234567890/pgshard-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5433:5432"]
    healthcheck: *pghealth
  shard1:
    image: ${PG_IMAGE:-ghcr.io/andrew01234567890/pgshard-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5434:5432"]
    healthcheck: *pghealth
  shard2:
    image: ${PG_IMAGE:-ghcr.io/andrew01234567890/pgshard-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5435:5432"]
    healthcheck: *pghealth
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000"]
    ports: ["10000:10000"]
  fake-gcs:
    image: fsouza/fake-gcs-server:1.55.1
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports: ["4443:4443"]
