# Local development stack: catalog + 3 shard PostgreSQL instances, object-store
# emulators, and the single-shard data path (pooler for shard0 + router).
#
# PG_IMAGE defaults to the official postgres image: these services rely on its
# entrypoint conventions (initdb on first start, POSTGRES_PASSWORD, a bare
# "postgres" command). The project image ghcr.io/andrew01234567890/pgshard-postgres
# runs pgshard-agent as PID 1 from an agent JSON config and does not initialise
# a cluster by itself, so it is not a drop-in here; use it through the operator
# (hack/kind) or with an explicit agent config instead.
#   docker compose -f hack/compose/docker-compose.yml up
#
# The data path (catalog-init, pooler-shard0, router) is under the "router"
# profile so the bare databases can still be started alone:
#   docker compose -f hack/compose/docker-compose.yml --profile router up --build
#   psql "postgres://app:app-secret@localhost:6432/app"
services:
  catalog:
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    healthcheck: &pghealth
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  shard0:
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5433:5432"]
    healthcheck: *pghealth
  shard1:
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5434:5432"]
    healthcheck: *pghealth
  shard2:
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_PASSWORD: pgshard
    ports: ["5435:5432"]
    healthcheck: *pghealth
  # Migrates the catalog and registers database "app" and role "app" (password
  # from PGSHARD_DEV_PASSWORD, default app-secret) on the catalog and shard0.
  catalog-init:
    profiles: ["router"]
    build: &routerbuild
      context: ../..
      dockerfile: Dockerfile.router
    image: pgshard-router:dev
    depends_on:
      catalog: {condition: service_healthy}
      shard0: {condition: service_healthy}
    environment:
      PGSHARD_DEV_PASSWORD: ${PGSHARD_DEV_PASSWORD:-app-secret}
    command:
      - dev-bootstrap
      - --catalog-dsn=postgres://postgres:pgshard@catalog:5432/catalog?sslmode=disable
      - --shard-dsn=postgres://postgres:pgshard@shard0:5432/postgres?sslmode=disable
      - --pooler-endpoint=pooler-shard0:15432
    restart: "no"
  pooler-shard0:
    profiles: ["router"]
    build: *routerbuild
    image: pgshard-router:dev
    depends_on:
      catalog-init: {condition: service_completed_successfully}
    entrypoint: ["pgshard-pooler"]
    command:
      - run
      - --insecure-dev
      - --listen=0.0.0.0:15432
      - --pg-host=shard0
      - --pg-port=5432
      - --pg-database=app
      - --catalog-dsn=postgres://postgres:pgshard@catalog:5432/catalog?sslmode=disable
      - --shard-set=default
      - --shard-id=0
  router:
    profiles: ["router"]
    build: *routerbuild
    image: pgshard-router:dev
    depends_on:
      pooler-shard0: {condition: service_started}
    command:
      - serve
      - --insecure-dev
      - --listen=0.0.0.0:6432
      - --catalog-dsn=postgres://postgres:pgshard@catalog:5432/catalog?sslmode=disable
    ports: ["6432:6432"]
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000"]
    ports: ["10000:10000"]
  fake-gcs:
    image: fsouza/fake-gcs-server:1.55.1
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports: ["4443:4443"]
