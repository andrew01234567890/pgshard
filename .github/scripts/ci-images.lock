# Every image `.github/scripts/ci-image.sh` puts into the runner's own Docker
# image store, as `<name> <reference> <image id>`. Bases a Dockerfile pulls
# during `make images`, and images a KIND node's containerd pulls, are not
# served from here and are not listed; the helper says what it does and does
# not take off the registry path.
#
# The reference is pinned by repository digest, so a republished tag can never
# be served from a cache entry keyed on this file. That alone does not make the
# cache trustworthy: the archive the cache holds is unsigned input that anything
# able to write this branch's cache can replace, and `docker load` restores a
# tag and never a repository digest, so the pinned reference is not something
# the helper can re-check a restored image against.
#
# The third column closes that gap. It is the image id, the digest of the
# linux/amd64 image config, which is what `docker image inspect --format
# '{{.Id}}'` reports and what `docker load` recomputes from the archive's own
# bytes. The helper serves an image only when its id is this one, so the value
# it trusts comes from this file rather than from the cache. Every job runs on
# `ubuntu-24.04`, so linux/amd64 is the only platform these resolve on.
#
# The buildkit id carries a second job. Buildx pulls its builder image before
# it looks in the local store and offers no way to skip that, so the builder is
# not stopped from fetching one: after it boots, `docker container inspect
# --format '{{.Image}}'` reports the id it is running, and the job fails unless
# that is the id below.
#
# To change a pin, pull the new reference and read both columns back from it:
#
#   docker pull <reference>
#   docker image inspect --format '{{.Id}}' <reference>
#
# postgres18 is the digest the operator deploys, so the fixtures exercise the
# PostgreSQL the product ships rather than whatever `postgres:18` points at
# today.
