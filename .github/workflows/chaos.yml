name: chaos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  chaos:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'chaos')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/chaos
      PG_MAJOR: "18"
      ROUTER_IMAGE: pgshard-router:e2e
      OPERATOR_IMAGE: pgshard-operator:e2e
      ADMIN_IMAGE: pgshard-admin:e2e
      CONTROLLER_IMAGE: pgshard-controller:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned rather than latest: the action SHA fixes the downloader, not the
          # binary it fetches, so an unpinned helm changes under a chart that has
          # not. Held on 3.x because hack/chaos/install.sh installs the Chaos Mesh
          # chart, which is published for helm 3.
          version: v3.21.4
      # Pure download, and the one step here that hack/ci/retry.sh cannot
      # wrap because it is an action rather than a command. Retried by hand
      # for the same reason the e2e matrix does: a failed fetch takes the
      # whole cell down without saying anything about the product.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        id: install_kind
        continue-on-error: true
        with:
          version: v0.32.0
          install_only: true
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        if: steps.install_kind.outcome == 'failure'
        with:
          version: v0.32.0
          install_only: true
      # The experiments run against a real cluster, so the images have to
      # exist and be in the node before the operator asks for them. Only the
      # PostgreSQL images are published, so a control-plane tag would not
      # resolve and the pods would sit in ImagePullBackOff.
      - name: Build images
        run: |
          docker buildx bake "postgres-${PG_MAJOR}" --load
          docker build -f Dockerfile.control --build-arg CMD=pgshard-operator   -t pgshard-operator:e2e .
          docker build -f Dockerfile.control --build-arg CMD=pgshard-admin      -t pgshard-admin:e2e .
          docker build -f Dockerfile.control --build-arg CMD=pgshard-controller -t pgshard-controller:e2e .
          docker build -f Dockerfile.router -t pgshard-router:e2e .
      - name: Create kind cluster
        run: hack/kind/up.sh
      - name: Load images
        run: |
          hack/kind/load-images.sh pgshard-operator:e2e pgshard-admin:e2e \
            pgshard-controller:e2e pgshard-router:e2e \
            "ghcr.io/andrew01234567890/pgshard-postgres:${PG_MAJOR}"
      - name: Install Chaos Mesh
        run: hack/chaos/install.sh
      - name: Run chaos suite
        run: |
          set -o pipefail
          mkdir -p "$E2E_ARTIFACTS"
          go test -tags chaos -count=1 -v -timeout 40m ./test/chaos/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chaos
          path: artifacts/
          if-no-files-found: ignore
      - name: Delete kind cluster
        if: always()
        run: hack/kind/down.sh
