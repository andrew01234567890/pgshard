name: chaos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  chaos:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'chaos')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/chaos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true
      - name: Create kind cluster
        run: hack/kind/up.sh
      - name: Install Chaos Mesh
        run: hack/chaos/install.sh
      - name: Run chaos suite
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          go test -tags chaos -count=1 -v ./test/chaos/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chaos
          path: artifacts/
          if-no-files-found: ignore
      - name: Delete kind cluster
        if: always()
        run: hack/kind/down.sh
