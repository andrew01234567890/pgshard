# Static analysis of the vendored C parser.
#
# The vendored libpg_query is compiled into the router and reads every
# statement a client sends, and no analyser looked at it: CodeQL's default
# setup covers Actions, Go and JavaScript, and adding C/C++ to it is a
# repository setting rather than a file in this tree. This runs a C
# analyser without touching that setting; if C/C++ is later added to the
# default setup, this workflow is the thing to delete.
#
# It GATES, on the part of the result that is ours to act on. The first
# baseline (nightly 33837983681) was 59 findings and every one of them was
# in vendored upstream C -- none in code this repository writes. Gating on
# those would have been gating on upstream forever, which is the red check
# nobody reads. So the ids upstream owns are suppressed by id in
# hack/pgparser/cppcheck-suppressions.txt, with the reason for each, and
# anything else fails: a class of finding never seen before, or any finding
# in our own C.
name: Parser scan

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "third_party/libpg_query/**"
      - "hack/pgparser/**"
      - ".github/workflows/parser-scan.yml"

permissions:
  contents: read

jobs:
  cppcheck:
    name: C static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cppcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cppcheck
          cppcheck --version
      - name: Analyse the vendored parser
        run: |
          set -euo pipefail
          mkdir -p parser-scan
          for dir in third_party/libpg_query/*/; do
            major="$(basename "$dir")"
            echo "::group::cppcheck $dir"
            # --force because the generated parser has more #if branches
            # than cppcheck explores by default, and missingInclude is
            # noise: the real include path is assembled by cgo, not here.
            # --error-exitcode stays 0 here so the report is always
            # produced and uploaded; the gate below reads it. A scan that
            # aborted on its first finding would upload nothing, which is
            # the opposite of useful when the question is what changed.
            cppcheck --force --quiet --enable=warning,performance,portability \
              --suppress=missingInclude --suppress=missingIncludeSystem \
              --suppressions-list=hack/pgparser/cppcheck-suppressions.txt \
              --inline-suppr --error-exitcode=0 \
              --xml "$dir" 2> "parser-scan/cppcheck-$major.xml" || true
            python3 - "parser-scan/cppcheck-$major.xml" <<'PY' | tee "parser-scan/cppcheck-$major.txt"
          import collections, os, sys, xml.etree.ElementTree as ET
          # cppcheck writes nothing at all when it refuses to start -- a
          # malformed suppressions file does exactly that -- and a bare
          # ParseError traceback says only that the XML is empty, not why.
          if os.path.getsize(sys.argv[1]) == 0:
              sys.exit("cppcheck produced no report; it failed before analysing "
                       "(a malformed --suppressions-list entry does this). See the step log above.")
          errors = ET.parse(sys.argv[1]).getroot().findall("./errors/error")
          by = collections.Counter(e.get("severity") for e in errors)
          print("%d finding(s): %s" % (len(errors), dict(by)))
          for e in errors:
              loc = e.find("location")
              where = "%s:%s" % (loc.get("file"), loc.get("line")) if loc is not None else "?"
              print("  [%s] %s %s: %s" % (e.get("severity"), e.get("id"), where, e.get("msg")))
          PY
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parser-scan
          path: parser-scan/
          retention-days: 14
      - name: Gate on findings that are ours
        run: |
          set -euo pipefail
          total=0
          for f in parser-scan/cppcheck-*.txt; do
            n=$(sed -n '1s/^\([0-9]*\) finding.*/\1/p' "$f")
            total=$((total + ${n:-0}))
          done
          if [ "$total" -eq 0 ]; then
            echo "no unsuppressed findings"
            exit 0
          fi
          echo "::error::$total cppcheck finding(s) outside the accepted set"
          echo "Every finding in the agreed baseline was upstream's and is suppressed by id in"
          echo "hack/pgparser/cppcheck-suppressions.txt. Something here is either a class of"
          echo "finding never seen before or is in code we write; both are worth reading."
          cat parser-scan/cppcheck-*.txt
          exit 1
