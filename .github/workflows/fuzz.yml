# Go runs a fuzz target's seed corpus during an ordinary `go test` and
# fuzzes only under -fuzz. Without this workflow the repository's fuzz
# targets never generate an input: they are table tests wearing a fuzzer's
# name. Two of them sit on the pre-authentication wire surface, which is
# where a length field trusted before it is bounded does the most damage.
#
# Scheduled rather than a PR gate. Fuzzing is bounded exploration, not a
# pass/fail signal a pull request should wait on, and a crasher is worth
# finding a day late.
#
# Bounded by EXECUTIONS, not by -fuzztime 5m, because the duration form
# fails the job at random: go.dev/issue/75804, where the coordinator reports
# its own expired deadline as the failure -- `--- FAIL: FuzzDecode (300.08s)`
# with `context deadline exceeded` and no crasher written. Once in the
# twelve nightly runs to 2026-09-13.
#
# REVERT THIS when the toolchain reaches Go 1.27, which carries the fix
# (`err == ctx.Err() ||` added to the suppression in internal/fuzz); go1.26.8
# still does not, so there is no patch release to wait for on this line.
#
# The counts are what each target reached in five minutes on this runner
# (2026-09-11..13): ~4.9M, ~4.8M and ~23M. timeout-minutes below is the only
# wall-clock bound -- go test stops its own -timeout alarm before fuzzing
# starts -- and leaves roughly six times that headroom.

name: fuzz

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: -fuzztime override for every target, e.g. 30m or 50000000x
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzCountStatements
            package: ./internal/pgwire/
            execs: 5000000x
          - target: FuzzDecodeStartupPacket
            package: ./internal/pgwire/
            execs: 5000000x
          - target: FuzzDecode
            package: ./internal/pgoutput/
            execs: 23000000x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' -fuzz '${{ matrix.target }}' \
            -fuzztime '${{ inputs.fuzztime || matrix.execs }}' '${{ matrix.package }}'
      # Go writes a failing input under testdata/fuzz/<target>/. Keeping it
      # is the whole point: committed as a seed it becomes a permanent
      # regression test, so the same defect cannot return unnoticed.
      #
      # cancelled() as well as failure(): timeout-minutes cancels the job
      # rather than failing it, and a crasher found before the cap is
      # already on disk -- exactly the run whose input is hardest to get
      # back, since it is the slow one.
      - name: Keep any crasher
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
