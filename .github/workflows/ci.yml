name: CI

on:
  # Retargeting a pull request moves `base.sha` without moving the head SHA, so
  # every base-relative check here keeps the green it earned against the base it
  # no longer has: the documentation advisory gate, `buf breaking --against`,
  # and `pgshard-release audit --base` all inherit that from this trigger, not
  # from anything of their own. Re-running them on a retarget means adding
  # `types: [edited]`, which also re-runs the whole of CI on every title and
  # description edit, so it is a decision about this trigger rather than about
  # any one gate.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests keep independent CI capacity. Every default-branch, scheduled,
# and exact-SHA dispatch run joins one FIFO queue so rapid main updates cannot
# build or publish concurrently.
concurrency:
  group: pgshard-ci-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect components
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      postgres_agent: ${{ steps.detect.outputs.postgres_agent }}
      catalog: ${{ steps.detect.outputs.catalog }}
      orch_catalog: ${{ steps.detect.outputs.orch_catalog }}
      pgwire: ${{ steps.detect.outputs.pgwire }}
      pooler_postgres: ${{ steps.detect.outputs.pooler_postgres }}
      planner: ${{ steps.detect.outputs.planner }}
      proto: ${{ steps.detect.outputs.proto }}
      go: ${{ steps.detect.outputs.go }}
      website: ${{ steps.detect.outputs.website }}
      website_exists: ${{ steps.detect.outputs.website_exists }}
      ui: ${{ steps.detect.outputs.ui }}
      integration: ${{ steps.detect.outputs.integration }}
      images: ${{ steps.detect.outputs.images }}
      kind: ${{ steps.detect.outputs.kind }}
      performance: ${{ steps.detect.outputs.performance }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed and available components
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          base=""
          force_all=false
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)
              # A green endpoint may repair an earlier failed release. When
              # its predecessor is untagged, test every component changed
              # since the latest released first-parent commit so that the
              # endpoint aggregate safely covers the complete release gap.
              base="$(
                .github/scripts/ci-diff-base.sh "$GITHUB_SHA" "$PUSH_BEFORE_SHA"
              )"
              ;;
            schedule|workflow_dispatch) force_all=true ;;
          esac

          if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git ls-files > "$RUNNER_TEMP/changed-files"
          fi

          changed() {
            # This helper controls the release authorization range. Changes to
            # it must exercise every available component before they can
            # authorize an aggregate endpoint.
            "$force_all" || grep -Eq "$1|^\.github/scripts/ci-diff-base\.sh$" \
              "$RUNNER_TEMP/changed-files"
          }

          exists_at_head_or_base() {
            [[ -e "$1" ]] || {
              [[ -n "$base" ]] && git cat-file -e "${base}:$1" 2>/dev/null
            }
          }

          emit_component() {
            local output="$1"
            local exists="$2"
            local pattern="$3"
            local value=false
            if [[ "$exists" == true ]] && changed "$pattern"; then
              value=true
            fi
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          }

          rust_exists=false
          postgres_agent_exists=false
          catalog_exists=false
          orch_catalog_exists=false
          pgwire_exists=false
          pooler_postgres_exists=false
          planner_exists=false
          proto_exists=false
          go_exists=false
          website_exists=false
          ui_exists=false
          integration_exists=false
          images_exists=false
          kind_exists=false
          performance_exists=false

          exists_at_head_or_base Cargo.toml && rust_exists=true
          exists_at_head_or_base crates/pgshard-agent/Cargo.toml && postgres_agent_exists=true
          exists_at_head_or_base crates/pgshard-catalog/Cargo.toml && catalog_exists=true
          exists_at_head_or_base crates/pgshard-orch/Cargo.toml && orch_catalog_exists=true
          exists_at_head_or_base crates/pgshard-pgwire/Cargo.toml && pgwire_exists=true
          exists_at_head_or_base crates/pgshard-pooler/Cargo.toml && pooler_postgres_exists=true
          exists_at_head_or_base crates/pgshard-planner/Cargo.toml && planner_exists=true
          exists_at_head_or_base buf.yaml && proto_exists=true
          exists_at_head_or_base operator/go.mod && go_exists=true
          exists_at_head_or_base website/package.json && website_exists=true
          exists_at_head_or_base ui/package.json && ui_exists=true
          exists_at_head_or_base crates/pgshard-integration-tests/Cargo.toml && integration_exists=true
          exists_at_head_or_base deploy/docker-bake.hcl && images_exists=true
          exists_at_head_or_base crates/pgshard-e2e/Cargo.toml && kind_exists=true
          exists_at_head_or_base benchmarks/Cargo.toml && performance_exists=true

          emit_component rust "$rust_exists" '(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|[^/]+\.rs)$|^crates/|^proto/|^contracts/|^deny\.toml$|^rustfmt\.toml$|^\.cargo/|^Makefile$|^\.github/'
          emit_component postgres_agent "$postgres_agent_exists" '^crates/(pgshard-agent|pgshard-types|pgshard-version)/|^crates/pgshard-catalog/migrations/|^crates/pgshard-catalog/inventory/|^crates/pgshard-catalog/testdata/|^contracts/replication-slot-names\.json$|^extensions/pgshard_fence/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^rustfmt\.toml$|^\.cargo/|^\.dockerignore$|^deploy/docker-bake\.hcl$|^deploy/images/|^Makefile$|^\.github/workflows/ci\.yml$|^\.github/scripts/'
          emit_component catalog "$catalog_exists" '^crates/(pgshard-catalog|pgshard-types)/|^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component orch_catalog "$orch_catalog_exists" '^crates/(pgshard-orch|pgshard-catalog|pgshard-types|pgshard-version)/|^operator/internal/tuning/|^contracts/|^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component pgwire "$pgwire_exists" '^crates/pgshard-pgwire/|^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component pooler_postgres "$pooler_postgres_exists" '^crates/(pgshard-pooler|pgshard-pgwire|pgshard-catalog|pgshard-types|pgshard-version)/|^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component planner "$planner_exists" '^crates/(pgshard-planner|pgshard-catalog|pgshard-types)/|^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component proto "$proto_exists" '^buf\.yaml$|^proto/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component go "$go_exists" '^operator/|^proto/|^contracts/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component website "$website_exists" '^website/|^docs/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component ui "$ui_exists" '^ui/|^proto/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component integration "$integration_exists" '^crates/|^operator/|^proto/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component images "$images_exists" '^deploy/|^extensions/|^Dockerfile|/Dockerfile$|^\.dockerignore$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^rustfmt\.toml$|^crates/|^operator/|^ui/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component kind "$kind_exists" '^deploy/|^charts/|^crates/|^operator/|^ui/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/|^Makefile$|^\.github/(workflows|scripts)/'
          emit_component performance "$performance_exists" '^benchmarks/|^crates/|^Cargo\.(toml|lock)$|^Makefile$|^\.github/(workflows|scripts)/'
          current_website_exists=false
          [[ -f website/package.json ]] && current_website_exists=true
          echo "website_exists=${current_website_exists}" >> "$GITHUB_OUTPUT"

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select actionlint Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: operator/go.sum
      # The gate tests run the advisory gate itself, so this job needs the Node
      # the gate runs under rather than whatever the runner image ships.
      - name: Select Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate workflow contracts
        run: make actions-check
      # Unconditional on purpose. These tests are what stops a gate being
      # retired, so running them from a gated job would let the same edit that
      # retires a gate also stop the test that would have caught it.
      - name: Prove the gates cannot be retired
        run: cargo test --locked -p pgshard-release
      - name: Validate title and public content
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            cargo run --locked -p pgshard-release -- validate --subject "$PR_TITLE"
            cargo run --locked -p pgshard-release -- audit --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            cargo run --locked -p pgshard-release -- validate
            audit_base="$(
              .github/scripts/ci-diff-base.sh --audit \
                "$GITHUB_SHA" "$PUSH_BEFORE_SHA"
            )"
            cargo run --locked -p pgshard-release -- audit \
              --base "$audit_base" --head "$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            cargo run --locked -p pgshard-release -- validate
            audit_base="$(
              .github/scripts/ci-diff-base.sh --audit "$GITHUB_SHA"
            )"
            cargo run --locked -p pgshard-release -- audit \
              --base "$audit_base" --head "$GITHUB_SHA"
          else
            cargo run --locked -p pgshard-release -- validate
          fi

  rust-static:
    name: Rust / static checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Install pinned Rust policy tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Run Rust static policy
        run: make rust-static

  rust-test:
    name: Rust / tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      - name: Run workspace tests
        run: make rust-test
      - name: Run optimized planner safety regressions
        if: needs.changes.outputs.planner == 'true'
        run: |
          cargo test --release --locked -p pgshard-planner small_stack
          cargo test --release --locked -p pgshard-planner --test log_redaction
      - name: Verify explicit identity from a source archive
        env:
          ARCHIVE_VERSION: 9.8.7-archive-test
        run: |
          archive_dir="$RUNNER_TEMP/source-archive"
          mkdir -p "$archive_dir"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          PGSHARD_BUILD_VERSION="$ARCHIVE_VERSION" \
          PGSHARD_GIT_SHA="$GITHUB_SHA" \
          PGSHARD_EXPECTED_VERSION="$ARCHIVE_VERSION" \
          PGSHARD_EXPECTED_SHA="$GITHUB_SHA" \
            cargo test --locked -p pgshard-version
      - name: Verify tag-only build identity invalidation
        run: |
          tag_dir="$RUNNER_TEMP/tag-invalidation"
          mkdir -p "$tag_dir"
          git archive HEAD | tar -x -C "$tag_dir"
          cd "$tag_dir"
          git init --quiet --initial-branch=main
          git config user.name "pgshard CI"
          git config user.email "noreply@github.com"
          git add --all
          git commit --quiet --message "test: create archive fixture"
          fixture_sha="$(git rev-parse HEAD)"
          development_version="0.0.0-dev+${fixture_sha:0:12}"
          PGSHARD_EXPECTED_VERSION="$development_version" \
          PGSHARD_EXPECTED_SHA="$fixture_sha" \
            cargo test --locked -p pgshard-version
          git tag v9.8.7
          PGSHARD_EXPECTED_VERSION="9.8.7" \
          PGSHARD_EXPECTED_SHA="$fixture_sha" \
            cargo test --locked -p pgshard-version

  catalog-postgres:
    name: Catalog / PostgreSQL 18
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start the PostgreSQL 18 fixture
        shell: bash
        run: |
          set -euo pipefail
          # The runner pulls a `services:` image before the first step runs,
          # under a back-off no workflow step can reach, so one Docker Hub
          # timeout fails the job before any of its work starts. Started from a
          # step, the pull retries under our own control.
          readonly postgres_image="postgres:18"
          for attempt in 1 2 3 4 5; do
            if docker pull "$postgres_image"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "failed to pull ${postgres_image} after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker run --detach --name pgshard-ci-postgres \
            --env POSTGRES_DB=shardschema \
            --env POSTGRES_PASSWORD=pgshard-ci-only \
            --publish 5432:5432 \
            "$postgres_image"
          ready=false
          for _ in {1..36}; do
            if docker exec pgshard-ci-postgres \
              pg_isready -U postgres -d shardschema >/dev/null
            then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker logs pgshard-ci-postgres
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      - name: Exercise migration and activation contracts
        env:
          PGSHARD_TEST_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5432/shardschema
        run: make catalog-test
      - name: Remove the PostgreSQL 18 fixture
        if: always()
        run: docker rm --force pgshard-ci-postgres 2>/dev/null || true

  orch-catalog-postgres:
    name: Orchestrator catalog / PostgreSQL 18
    needs: changes
    if: needs.changes.outputs.orch_catalog == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Start the PostgreSQL 18 and PostgreSQL 17 fixtures
        shell: bash
        run: |
          set -euo pipefail
          # The runner pulls a `services:` image before the first step runs,
          # under a back-off no workflow step can reach, so one Docker Hub
          # timeout fails the job before any of its work starts. Started from a
          # step, the pull retries under our own control.
          readonly primary_image="postgres:18"
          readonly legacy_image="postgres:17"
          for image in "$primary_image" "$legacy_image"; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                break
              fi
              if (( attempt == 5 )); then
                echo "failed to pull ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done
          docker run --detach --name pgshard-ci-postgres \
            --env POSTGRES_DB=shardschema \
            --env POSTGRES_PASSWORD=pgshard-ci-only \
            --env POSTGRES_INITDB_ARGS="--set wal_level=logical --set max_prepared_transactions=10 --set hot_standby_feedback=on --set wal_receiver_status_interval=1s --set sync_replication_slots=on --set primary_slot_name=pgshard_member_0001 --set synchronized_standby_slots=pgshard_member_0001" \
            --publish 5432:5432 \
            "$primary_image"
          docker run --detach --name pgshard-ci-postgres17 \
            --env POSTGRES_DB=shardschema \
            --env POSTGRES_PASSWORD=pgshard-ci-only \
            --publish 5433:5432 \
            "$legacy_image"
          for container in pgshard-ci-postgres pgshard-ci-postgres17; do
            ready=false
            for _ in {1..36}; do
              if docker exec "$container" \
                pg_isready -U postgres -d shardschema >/dev/null
              then
                ready=true
                break
              fi
              sleep 5
            done
            if [[ "$ready" != true ]]; then
              docker logs "$container"
              exit 1
            fi
          done
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      - name: Load one fenced standby attachment policy
        env:
          PGSHARD_TEST_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5432/shardschema
        run: make orch-catalog-test
      - name: Start a PostgreSQL 18 streaming standby
        shell: bash
        run: |
          set -euo pipefail
          readonly primary_container=pgshard-ci-postgres
          docker exec "$primary_container" psql \
            --username postgres --dbname shardschema --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE pgshard_replicator WITH REPLICATION LOGIN PASSWORD 'pgshard-ci-only'"
          docker exec "$primary_container" psql \
            --username postgres --dbname shardschema --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE pgshard_observer_restricted LOGIN PASSWORD 'pgshard-test-only'"
          docker exec "$primary_container" psql \
            --username postgres --dbname shardschema --set ON_ERROR_STOP=1 \
            --command "GRANT pg_read_all_stats TO pgshard_observer_restricted WITH INHERIT FALSE"
          docker exec --user postgres "$primary_container" sh -ceu \
            'printf "%s\n" "host replication pgshard_replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"; pg_ctl reload --pgdata "$PGDATA"'
          docker volume create pgshard-ci-standby >/dev/null
          docker run --rm --user postgres \
            --add-host host.docker.internal:host-gateway \
            --env PGPASSWORD=pgshard-ci-only \
            --volume pgshard-ci-standby:/var/lib/postgresql \
            postgres:18 \
            pg_basebackup --host host.docker.internal --port 5432 \
              --username pgshard_replicator \
              --pgdata /var/lib/postgresql/18/docker \
              --write-recovery-conf --wal-method stream --create-slot \
              --slot pgshard_member_0001 --checkpoint fast
          docker exec "$primary_container" psql \
            --username postgres --dbname shardschema --set ON_ERROR_STOP=1 \
            --command "SELECT slot_name, lsn FROM pg_catalog.pg_create_logical_replication_slot('pgshard_ci_anchor_00000000000000000000000000000001', 'pgoutput', false, true, true)"
          docker run --detach --name pgshard-ci-standby \
            --add-host host.docker.internal:host-gateway \
            --publish 5434:5434 \
            --user postgres \
            --volume pgshard-ci-standby:/var/lib/postgresql \
            postgres:18 \
            postgres -D /var/lib/postgresql/18/docker -p 5434 \
              -c "primary_conninfo=host=host.docker.internal port=5432 user=pgshard_replicator password=pgshard-ci-only dbname=shardschema application_name=pgshard_member_0001 sslmode=disable" \
              -c primary_slot_name=pgshard_member_0001 \
              -c hot_standby_feedback=on \
              -c wal_receiver_status_interval=1s \
              -c sync_replication_slots=on
          ready=false
          for _ in {1..30}; do
            if docker exec pgshard-ci-standby \
              pg_isready --username postgres --dbname shardschema --port 5434 >/dev/null
            then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs pgshard-ci-standby
            exit 1
          fi
          receiver_count="$(docker exec pgshard-ci-standby psql \
            --username postgres --dbname shardschema --port 5434 \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_catalog.pg_stat_wal_receiver WHERE status = 'streaming' AND slot_name = 'pgshard_member_0001'")"
          test "$receiver_count" = 1
      - name: Observe local logical slots and prerequisites
        env:
          PGSHARD_TEST_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5432/shardschema
          PGSHARD_TEST_LEGACY_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5433/shardschema
          PGSHARD_TEST_STANDBY_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5434/shardschema
        run: make orch-slot-observer-test
      - name: Remove the PostgreSQL 18 streaming standby
        if: always()
        shell: bash
        run: |
          set -u
          docker rm --force pgshard-ci-standby 2>/dev/null || true
          docker exec pgshard-ci-postgres psql \
            --username postgres --dbname shardschema \
            --command "SELECT pg_catalog.pg_drop_replication_slot(slot_name) FROM pg_catalog.pg_replication_slots WHERE slot_name = 'pgshard_ci_anchor_00000000000000000000000000000001'" \
            --command "SELECT pg_catalog.pg_drop_replication_slot(slot_name) FROM pg_catalog.pg_replication_slots WHERE slot_name = 'pgshard_member_0001'" \
            >/dev/null || true
          docker volume rm pgshard-ci-standby 2>/dev/null || true
      - name: Remove the PostgreSQL 18 and PostgreSQL 17 fixtures
        if: always()
        run: docker rm --force pgshard-ci-postgres pgshard-ci-postgres17 2>/dev/null || true

  planner-postgres:
    name: Planner / PostgreSQL 18
    needs: changes
    if: needs.changes.outputs.planner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start the PostgreSQL 18 fixture
        shell: bash
        run: |
          set -euo pipefail
          # The runner pulls a `services:` image before the first step runs,
          # under a back-off no workflow step can reach, so one Docker Hub
          # timeout fails the job before any of its work starts. Started from a
          # step, the pull retries under our own control.
          readonly postgres_image="postgres:18"
          for attempt in 1 2 3 4 5; do
            if docker pull "$postgres_image"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "failed to pull ${postgres_image} after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker run --detach --name pgshard-ci-postgres \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_PASSWORD=pgshard-ci-only \
            --publish 5432:5432 \
            "$postgres_image"
          ready=false
          for _ in {1..36}; do
            if docker exec pgshard-ci-postgres \
              pg_isready -U postgres -d postgres >/dev/null
            then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker logs pgshard-ci-postgres
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      - name: Compare admitted syntax with PostgreSQL 18
        env:
          PGSHARD_TEST_DATABASE_URL: postgresql://postgres:pgshard-ci-only@127.0.0.1:5432/postgres
        run: make planner-postgres-test
      - name: Remove the PostgreSQL 18 fixture
        if: always()
        run: docker rm --force pgshard-ci-postgres 2>/dev/null || true

  pgwire-postgres:
    name: PostgreSQL wire / PostgreSQL 18
    needs: changes
    if: needs.changes.outputs.pgwire == 'true' || needs.changes.outputs.pooler_postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start the PostgreSQL 18 fixture
        shell: bash
        run: |
          set -euo pipefail
          # The runner pulls a `services:` image before the first step runs,
          # under a back-off no workflow step can reach, so one Docker Hub
          # timeout fails the job before any of its work starts. Started from a
          # step, the pull retries under our own control.
          readonly postgres_image="postgres:18"
          for attempt in 1 2 3 4 5; do
            if docker pull "$postgres_image"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "failed to pull ${postgres_image} after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker run --detach --name pgshard-ci-postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_INITDB_ARGS="--set wal_level=logical --set max_prepared_transactions=10" \
            --publish 5432:5432 \
            "$postgres_image"
          ready=false
          for _ in {1..36}; do
            if docker exec pgshard-ci-postgres \
              pg_isready -U postgres -d postgres >/dev/null
            then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker logs pgshard-ci-postgres
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      - name: Decode real PostgreSQL 18 wire and persistent-slot controls
        if: needs.changes.outputs.pgwire == 'true'
        env:
          PGSHARD_PGWIRE_TEST_ADDRESS: 127.0.0.1:5432
        run: make pgwire-postgres-test
      - name: Relay a live PostgreSQL 18 session through the pooler
        if: needs.changes.outputs.pooler_postgres == 'true'
        env:
