  pgwire-fuzz:
    name: Pgwire fuzz / ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.pgwire == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_startup
          - decode_frontend
          - decode_backend
          - pgoutput_decoder
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-
      - name: Install pinned fuzz toolchain
        env:
          FUZZ_TOOLCHAIN: nightly-2026-06-24
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Exercise bounded decoder
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TOOLCHAIN: nightly-2026-06-24
        working-directory: crates/pgshard-pgwire
        run: |
          runs=10000
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            runs=100000
          fi
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$FUZZ_TARGET" -- \
            -runs="$runs" -max_len=65536 -timeout=10

  protobuf:
    name: Protobuf contracts
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pinned Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.71.0
          setup_only: true
          github_token: ${{ github.token }}
      - name: Validate protobuf contracts
        run: make proto-check
      - name: Reject protobuf breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=$BASE_SHA"
          else
            echo "No protobuf contract exists at the pull request base; skipping initial breaking comparison."
          fi

  go-operator:
    name: Go operator
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Validate operator
        run: make go-check

  operator-kind:
    name: Operator KIND API safety
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Create disposable Kubernetes cluster
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          # kind pulls the node image itself without retrying, and a
          # registry timeout here leaves no cluster for every later step.
          readonly node_image="kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
          for attempt in 1 2 3 4; do
            if docker pull "$node_image"; then
              break
            fi
            if (( attempt == 4 )); then
              echo "failed to pull the KIND node image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          kind create cluster \
            --name pgshard-operator \
            --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5 \
            --wait 90s
          test "$(kubectl version --output=json | jq --raw-output '.serverVersion.minor')" = "36"
          kubectl apply --server-side --field-manager=pgshard-ci -f operator/config/crd/bases/pgshard.io_pgshardclusters.yaml
      - name: Verify API ownership and deletion safety
        working-directory: operator
        env:
          PGSHARD_KIND_E2E: "true"
        run: >-
          go test -race -count=1
          -run '^(TestKINDCRDRejectsUnsafeSpecTransitionsWithoutWebhooks|TestKINDDeletionWaitsForOwnedResourcesBeforeSameNameRecreate|TestKINDGarbageCollectorDeletesLatePostgreSQLCreationFence|TestKINDServerSideApplyPrunesAndIsolatesScaleOwnership)$'
          ./internal/controller
      - name: Delete disposable Kubernetes cluster
        if: always()
        run: kind delete cluster --name pgshard-operator

  operator-kind-manager:
    name: Operator KIND manager smoke / ${{ matrix.group }}
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Every leg builds its own images and cluster, so one failing leg must
      # not cancel the diagnostics of the others.
      fail-fast: false
      matrix:
        include:
          - group: admission
            package: ./internal/controller
            tests: '^TestKIND(AdmissionWebhooksUseManagedTLSAndRejectUnsafeSpec|AdmissionRemainsAvailableDuringCompatibleManagerRestart)$'
          - group: reconciliation
            package: ./internal/controller
            tests: '^TestKIND(ManagerReconcilesFailClosedDevelopmentCluster|RestoreTopologyMismatchIsRejectedBeforeMutation|ManagerRejectsPostgreSQLRuntimeChange)$'
          - group: postgresql
            package: ./internal/controller
            tests: '^TestKIND(ManagerRunsSingleMemberPostgreSQL18Primaries|ManagerDeletePolicyReleasesBoundPostgreSQLPVC|ManagerRetainPolicyReleasesExplicitlyDeletingPostgreSQLPVC)$'
          - group: bootstrap
            package: ./internal/resources
            tests: '^TestPostgreSQLBootstrapDockerRecoveryAndConflict$'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Pull the Buildx builder image
        run: |
          # setup-buildx-action boots its builder from a container it pulls
          # itself, with no retry, so one registry timeout fails the job before
          # any of its work starts. Pulling first leaves the image local; the
          # cascade otherwise reads as a cluster failure two steps later.
          readonly buildkit_image="moby/buildkit:buildx-stable-1"
          for attempt in 1 2 3 4; do
            if docker pull "$buildkit_image"; then
              break
            fi
            if (( attempt == 4 )); then
              echo "failed to pull the Buildx builder image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Set up local-image Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Build manager smoke images without publishing
        env:
          PGSHARD_BUILD_VERSION: 0.0.0-dev+ci.${{ github.sha }}
          PGSHARD_GIT_SHA: ${{ github.sha }}
          PGSHARD_IMAGE_OUTPUT: artifacts/images
          PGSHARD_IMAGE_TAG: dev
          PGSHARD_IMAGE_TARGETS: operator orchestrator pooler postgres-agent
        shell: bash
        run: |
          set -euo pipefail
          make images
          for component in operator orchestrator pooler postgres-agent; do
            docker load --input "artifacts/images/pgshard-${component}.tar"
            image="pgshard/${component}:dev"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$PGSHARD_GIT_SHA"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$PGSHARD_BUILD_VERSION"
          done
      - name: Create disposable Kubernetes cluster
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          # kind pulls the node image itself without retrying, and a
          # registry timeout here leaves no cluster for every later step.
          readonly node_image="kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
          for attempt in 1 2 3 4; do
            if docker pull "$node_image"; then
              break
            fi
            if (( attempt == 4 )); then
              echo "failed to pull the KIND node image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          kind create cluster \
            --name pgshard-manager \
            --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5 \
            --wait 90s
          test "$(kubectl version --output=json | jq --raw-output '.serverVersion.minor')" = "36"
          # Pull the digest through the node's CRI. Importing this image from
          # Docker's containerd store can leave KIND with a transient source
          # alias that kubelet cannot resolve when it creates a container.
          readonly postgres_image="docker.io/library/postgres:18@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500"
          for attempt in 1 2 3 4; do
            if docker exec pgshard-manager-control-plane crictl pull "$postgres_image"; then
              break
            fi
            if (( attempt == 4 )); then
              echo "failed to pull the pinned PostgreSQL image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          kind load docker-image \
            pgshard/operator:dev \
            pgshard/orchestrator:dev \
            pgshard/pooler:dev \
            pgshard/postgres-agent:dev \
            --name pgshard-manager
      - name: Install the self-managed admission manager
        run: |
          kubectl apply --server-side --field-manager=pgshard-ci -k operator/config/admission
          kubectl rollout status \
            --namespace pgshard-system \
            deployment/pgshard-controller-manager \
            --timeout=180s
      - name: Verify admission and real reconciliation
        working-directory: operator
        env:
          PGSHARD_KIND_MANAGER_E2E: "true"
          PGSHARD_POSTGRES_BOOTSTRAP_E2E: "true"
          PGSHARD_POSTGRES_BOOTSTRAP_IMAGE: pgshard/postgres-agent:dev
        run: |
          go test -race -count=1 -timeout=30m \
            -run '${{ matrix.tests }}' \
            ${{ matrix.package }}
      # Runs before the cluster is deleted, and collects the node itself as
      # well as the workloads. Every member, orchestrator, pooler and manager
      # shares one KIND node, so a kube-proxy, CoreDNS, conntrack or CNI
      # failure there surfaces as an unrelated product symptom in each of them.
      - name: Capture KIND diagnostics
        if: failure()
        run: |
          set -euo pipefail
          .github/scripts/capture-kind-diagnostics.sh \
            pgshard-manager "$RUNNER_TEMP/kind-diagnostics"
          cat "$RUNNER_TEMP/kind-diagnostics/cluster.txt"
          tail --lines=200 "$RUNNER_TEMP/kind-diagnostics/logs/manager.log"
      - name: Store KIND diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-diagnostics-manager-${{ matrix.group }}
          path: ${{ runner.temp }}/kind-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Delete disposable Kubernetes cluster
        if: always()
        run: kind delete cluster --name pgshard-manager

