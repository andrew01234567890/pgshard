name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    # The PostgreSQL-backed tests pull the project's postgres image, which is
    # a private GHCR package.
    permissions:
      contents: read
      packages: read
    env:
      CGO_ENABLED: "1"
      # Turn "image unavailable" from a skip into a failure. Without it a job
      # that could not pull the image reported green while every
      # PostgreSQL-backed suite silently skipped.
      PGSHARD_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: make test
      - run: make build

  envtest:
    name: Envtest (API, operator, admin)
    runs-on: ubuntu-latest
    env:
      # Missing control-plane assets must fail here, not exit zero. Over fifty
      # deterministic tests -- CRD validation, failover, rolling restart,
      # storage rebuild, reshard retirement, catalog upgrade -- used to skip
      # silently because `make test` never sets KUBEBUILDER_ASSETS and no
      # workflow called `make envtest`.
      PGSHARD_REQUIRE_ENVTEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile', 'hack/envtest/setup-envtest.sh') }}
      - run: make envtest

  proto:
    name: Proto lint and generated code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install buf and protoc plugins
        run: |
          set -euo pipefail
          go install github.com/bufbuild/buf/cmd/buf@v1.71.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto-lint
      - run: make proto
      - name: Fail on generated code drift
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- internal/gen; then
            echo "::error::internal/gen is out of date; run 'make proto' and commit the result"
            exit 1
          fi
          if git status --porcelain -- internal/gen | grep -q .; then
            echo "::error::untracked generated files under internal/gen"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "false"

  actionlint:
    name: Workflow lint and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf actionlint.tar.gz -C "$HOME/bin" actionlint
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: actionlint -color
      - run: hack/check-actions.sh
      - run: hack/test-check-actions.sh

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          re='^(feat|fix|docs|ci|build|chore|refactor|test|perf|style|revert)(\(.+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $re ]]; then
            echo "PR title OK"
          else
            echo "::error::PR title must follow Conventional Commits: type(scope)?: description"
            exit 1
          fi

  gate:
    name: CI gate
    # One required check that cannot pass while any job above it failed or was
    # skipped. Requiring the jobs individually meant a new one -- proto drift
    # was the example -- stayed advisory until somebody remembered to add its
    # name to branch protection.
    needs: [go, envtest, proto, govulncheck, secret-scan, actionlint, pr-title]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries
            | map(select(.value.result != "success"))
            | map(select((.key == "pr-title" and .value.result == "skipped") | not))
            | map("\(.key)=\(.value.result)") | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed: $failed"
            exit 1
          fi
          echo "all required jobs succeeded"
