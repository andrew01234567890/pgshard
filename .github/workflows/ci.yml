name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    # The PostgreSQL-backed tests pull the project's postgres image, which is
    # a private GHCR package.
    permissions:
      contents: read
      packages: read
    env:
      CGO_ENABLED: "1"
      # Turn "image unavailable" from a skip into a failure. Without it a job
      # that could not pull the image reported green while every
      # PostgreSQL-backed suite silently skipped.
      PGSHARD_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read tool pins
        id: pins
        run: |
          set -euo pipefail
          . hack/tools/versions.env
          echo "golangci_lint=$GOLANGCI_LINT_VERSION" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.pins.outputs.golangci_lint }}
          install-only: true
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - name: Migration numbers do not collide with the base branch
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref || github.ref_name }}"
          hack/test-check-migration-numbers.sh
          hack/check-migration-numbers.sh FETCH_HEAD
      - run: make mod-check
      - run: make vendor-check
      - run: make test
      - run: make build

  envtest:
    name: Envtest (API, operator, admin)
    runs-on: ubuntu-latest
    env:
      # Missing control-plane assets must fail here, not exit zero. Over fifty
      # deterministic tests -- CRD validation, failover, rolling restart,
      # storage rebuild, reshard retirement, catalog upgrade -- used to skip
      # silently because `make test` never sets KUBEBUILDER_ASSETS and no
      # workflow called `make envtest`.
      PGSHARD_REQUIRE_ENVTEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile', 'hack/envtest/setup-envtest.sh') }}
      - run: make envtest

  proto:
    name: Proto lint and generated code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install buf and protoc plugins
        run: |
          set -euo pipefail
          hack/tools/install.sh buf protoc-gen-go protoc-gen-go-grpc
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto-lint
      # The target existed and nothing ran it, so the repository had a
      # wire-compatibility gate that was configured, working and never
      # consulted -- a declaration nobody honours, which is the same shape
      # as the defects it would be catching.
      - run: make proto-breaking
      - run: make proto
      - name: Fail on generated code drift
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- internal/gen; then
            echo "::error::internal/gen is out of date; run 'make proto' and commit the result"
            exit 1
          fi
          if git status --porcelain -- internal/gen | grep -q .; then
            echo "::error::untracked generated files under internal/gen"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: |
          set -euo pipefail
          hack/tools/install.sh govulncheck
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make govulncheck

  integration:
    name: Integration (router, agent, pgtune)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A missing image must fail this job rather than skip its tests: a
      # suite that silently ran nothing is what this job exists to end.
      PGSHARD_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build the PostgreSQL image the suites run against
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-18
          load: true
        env:
          CI: "true"
      - run: make integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run by digest rather than through the action. The action is SHA
      # pinned, which fixes the downloader and not the binary it fetches:
      # it pulls a release tarball with no digest check, so whoever can
      # replace that asset decides what this gate runs. A gate that can be
      # replaced is worth less than no gate, because it reports success.
      #
      # git, not dir: dir scans the working tree, so a secret committed and
      # then deleted would pass. That is why the checkout above asks for
      # the whole history.
      #
      # -v because without it the only output is "leaks found: N" -- no
      # file, no line, no commit -- and `gh run view --log-failed` shows
      # exactly that. An author whose PR just went red has nothing to act
      # on. The finding is redacted, so naming it is safe.
      - name: Scan history for secrets
        id: scan
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact -v
      # A full-depth checkout on a pull_request fetches every branch, not
      # just this one, so the scan covers the whole repository. That is the
      # stronger guarantee for a public repository -- a secret on any
      # branch is a leak -- but it means a finding on someone else's branch
      # fails this check here, on a change that has nothing to do with it.
      # Saying so is the difference between a gate people act on and one
      # they rerun.
      - name: Say where a finding may be
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          {
            echo "### Secret scan"
            echo
            echo "The scan covers **every branch**, not just this pull request: a full-depth"
            echo "checkout fetches them all, and a secret on any branch of a public repository"
            echo "is a leak."
            echo
            echo "So a finding above may be on a branch that has nothing to do with this change."
            echo "Check the \`Commit:\` and \`File:\` it names before assuming it is yours."
            echo
            echo "If it is yours: **amend**, do not add a commit. The scan reads history, so the"
            echo "original blob stays reachable until the branch is force-pushed."
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: Workflow lint and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install actionlint
        run: |
          set -euo pipefail
          hack/tools/install.sh actionlint
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make actionlint

  pr-title:
    name: Title at push
    # pr-title.yml owns the `PR title` check, because that one re-runs when
    # the title is edited and this one cannot: adding `edited` here would
    # re-run every job in this workflow whenever anybody touched a
    # description. This copy exists only so the gate can see the title --
    # a job in another workflow cannot be a `needs` -- and so it is named
    # differently, or the two would report under one context.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          re='^(feat|fix|docs|ci|build|chore|refactor|test|perf|style|revert)(\(.+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $re ]]; then
            echo "PR title OK"
          else
            echo "::error::PR title must follow Conventional Commits: type(scope)?: description"
            exit 1
          fi

  gate:
    name: CI gate
    # One required check that cannot pass while any job above it failed or was
    # skipped. Requiring the jobs individually meant a new one -- proto drift
    # was the example -- stayed advisory until somebody remembered to add its
    # name to branch protection.
    needs: [go, envtest, proto, govulncheck, secret-scan, actionlint, pr-title]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries
            | map(select(.value.result != "success"))
            | map(select((.key == "pr-title" and .value.result == "skipped") | not))
            | map("\(.key)=\(.value.result)") | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed: $failed"
            exit 1
          fi
          echo "all required jobs succeeded"
