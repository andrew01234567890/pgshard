name: images

on:
  push:
    branches: [main]
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      # The image builds pgshard-agent AND pgshard-pooler from a COPY of the
      # whole repository, so anything either binary can import belongs here.
      # Naming only the agent's own packages meant a merged pooler fix left
      # the published tags running the old binary.
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      # The image builds pgshard-agent AND pgshard-pooler from a COPY of the
      # whole repository, so anything either binary can import belongs here.
      # Naming only the agent's own packages meant a merged pooler fix left
      # the published tags running the old binary.
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

# No package write here. A pull request's own code runs in this workflow,
# including a change to this file, so a token that can replace published
# tags must not be handed out before review: only the publish job below
# gets one, and only on main.
permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        major: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action's SHA pins the setup, not what it installs: without these the
      # runner takes whatever buildx and BuildKit are current. This builder runs
      # with GHCR credentials, so "latest" here is unreviewed code holding a
      # publishing token.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-${{ matrix.major }}
          load: true
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
      - name: smoke
        run: |
          image=ghcr.io/andrew01234567890/pgshard-postgres:${{ matrix.major }}
          docker run --rm --entrypoint postgres "$image" --version
          docker run --rm --entrypoint pgbackrest "$image" version
          docker run --rm "$image" --version
          docker run --rm --entrypoint pgshard-pooler "$image" --version
          # The agent and the pooler ship inside this image and are as
          # deployed as anything the control plane publishes. Built without
          # the build arguments they answer "dev (none, unknown)", which
          # cannot tell anyone which commit is running on a member -- so the
          # smoke test asks, rather than trusting that the arguments arrived.
          for name in pgshard-agent pgshard-pooler; do
            got=$(docker run --rm --entrypoint "$name" "$image" --version)
            echo "$got"
            case "$got" in
              *"(none,"*|*"unknown)"*)
                echo "::error::$name reports no build metadata: $got" >&2
                exit 1 ;;
            esac
          done

  # Publishing is main's alone, and it happens after the smoke test rather
  # than before it. workflow_dispatch lets anyone with write access choose
  # the branch, and these tags -- :18, :18.6, :19, :19beta3 -- are what every
  # cluster pulls, so a manual run of an unmerged branch could once replace
  # them with code that had passed no review. A run on any other branch still
  # builds and smoke-tests; this job simply does not exist for it.
  control:
    name: build and smoke (control plane)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: control
          load: true
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
      - name: smoke
        run: |
          for name in operator controller admin router; do
            docker run --rm "ghcr.io/andrew01234567890/pgshard-$name:latest" --version
          done

  # The images getting-started tells a reader to deploy. Publishing is main's
  # alone and happens after the smoke test, exactly as the PostgreSQL images
  # do; a run on any other branch still builds and smoke-tests them.
  publish-control:
    name: publish (control plane)
    needs: control
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: control
          push: true
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}

  publish:
    name: publish
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        major: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build job filled the shared cache, so this rebuild is a cache
      # replay of the bits that were just smoke-tested.
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-${{ matrix.major }}
          push: true
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
