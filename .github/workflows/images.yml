name: images

on:
  push:
    branches: [main]
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      - "cmd/pgshard-agent/**"
      - "internal/agent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      - "cmd/pgshard-agent/**"
      - "internal/agent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          targets: postgres-${{ matrix.major }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
      - name: smoke
        run: |
          image=ghcr.io/andrew01234567890/pgshard-postgres:${{ matrix.major }}
          docker run --rm --entrypoint postgres "$image" --version
          docker run --rm --entrypoint pgbackrest "$image" version
          docker run --rm "$image" --version
