name: images

on:
  push:
    branches: [main]
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      # The image builds pgshard-agent AND pgshard-pooler from a COPY of the
      # whole repository, so anything either binary can import belongs here.
      # Naming only the agent's own packages meant a merged pooler fix left
      # the published tags running the old binary.
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "postgres/**"
      - "docker-bake.hcl"
      # The image builds pgshard-agent AND pgshard-pooler from a COPY of the
      # whole repository, so anything either binary can import belongs here.
      # Naming only the agent's own packages meant a merged pooler fix left
      # the published tags running the old binary.
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Publishing is main's alone. workflow_dispatch lets anyone with write
      # access choose the branch, and these tags -- :18, :18.6, :19,
      # :19beta3 -- are what every cluster pulls, so a manual run of an
      # unmerged branch could replace them with code that had passed no
      # review at all. A manual run still builds and smoke-tests; it just
      # cannot publish.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-${{ matrix.major }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
        env:
          CI: "true"
          GIT_SHA: ${{ github.sha }}
      - name: smoke
        run: |
          image=ghcr.io/andrew01234567890/pgshard-postgres:${{ matrix.major }}
          docker run --rm --entrypoint postgres "$image" --version
          docker run --rm --entrypoint pgbackrest "$image" version
          docker run --rm "$image" --version
          docker run --rm --entrypoint pgshard-pooler "$image" --version
