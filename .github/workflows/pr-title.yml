# A pull request's title is validated in two places, deliberately.
#
# This workflow owns the `PR title` check, the required one, because it is
# the only one that can re-run when the title changes. Every stacked pull
# request is created with a generated title and given a real one seconds
# later, so a check that only ever sees the placeholder blocks a merge on a
# title that is in fact valid, and never revisits one edited into an invalid
# shape.
#
# ci.yml keeps a copy under a different name, `Title at push`, so its gate
# can see the title as a `needs`. It cannot carry the required check itself:
# adding `edited` to that workflow would re-run every job in it whenever
# anybody touched a description.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          re='^(feat|fix|docs|ci|build|chore|refactor|test|perf|style|revert)(\(.+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $re ]]; then
            echo "PR title OK"
          else
            echo "::error::PR title must follow Conventional Commits: type(scope)?: description"
            exit 1
          fi
