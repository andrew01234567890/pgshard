name: e2e-kind

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the last one, so cancelling is
  # right there. On main it is not: cancelling means the merge that follows
  # kills the run proving the merge before it, and a run of merges leaves
  # every composition in between unverified.
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this pull request touches anything the e2e matrix could prove
  # something about. A docs-only change cannot break resharding, and every
  # cell it occupies is capacity the pull requests that could merge are
  # waiting for.
  #
  # The cells still RUN and still report: several of them are required
  # contexts, and a required check that never runs never reports, which
  # blocks the pull request for ever. So this decides whether the cells do
  # their WORK, not whether they exist. paths-ignore would have stranded
  # every docs pull request instead of speeding it up.
  changes:
    name: e2e relevance
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request runs everything: a push to
          # main proves the merge, and there is no base to compare against.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD" || true)
          if [ -z "$changed" ]; then
            # No readable diff is not evidence of a docs-only change.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Err toward running. docs/ and top-level .md files are safe to
          # skip; .github/ is not, because a workflow change must run the
          # workflows, and neither is test/ or hack/.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "only docs changed; cells will report without provisioning clusters"
          fi

  e2e:
    name: e2e (pg${{ matrix.pg }}, ${{ matrix.suite }})
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'upgrade' || startsWith(matrix.suite, 'reshard-')) && 120 || 80 }}
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]
        suite: [smoke, operator, backup, reshard]
        include:
          # The upgrade suite runs the online 18 -> 19 major upgrade, so it
          # needs both majors' images. The scale suites drive one reshard each
          # under continuous write load: a split and a merge, in separate jobs
          # with separate clusters, because three transitions in one job did
          # not finish inside a per-step budget the last one could use. One
          # major each keeps the matrix inside the runner budget.
          - pg: 18
            suite: upgrade
          - pg: 18
            suite: reshard-split
          - pg: 18
            suite: reshard-merge
    env:
      PG_MAJOR: ${{ matrix.pg }}
      # The CRD refuses a beta major without an explicit image, so a suite
      # that runs one names it. This is the same image the load step puts
      # into kind, so the gate costs a line and changes nothing else.
      PGSHARD_POSTGRES_IMAGE: ghcr.io/andrew01234567890/pgshard-postgres:${{ matrix.pg }}
      E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        id: checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        id: setup_go
        with:
          go-version-file: go.mod
      # Retried by hand rather than through hack/ci/retry.sh, which wraps
      # commands and cannot wrap an action. These two steps are pure
      # downloads and were the only unretried ones left: across sixty runs
      # they took down three failing cells between them, each costing a
      # required context and roughly forty minutes of somebody's rerun.
      # The SHA stays pinned; only the attempt is repeated.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        if: needs.changes.outputs.code == 'true'
        id: install_kind
        continue-on-error: true
        with:
          version: v0.32.0
          install_only: true
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        id: install_kind_retry
        if: steps.install_kind.outcome == 'failure' && needs.changes.outputs.code == 'true'
        with:
          version: v0.32.0
          install_only: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
        id: setup_buildx
        continue-on-error: true
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
        id: setup_buildx_retry
        if: matrix.suite != 'smoke' && steps.setup_buildx.outcome == 'failure' && needs.changes.outputs.code == 'true'
      - name: Warm the module and base-image caches
        if: needs.changes.outputs.code == 'true'
        id: warm_caches
        # The failures that take a cell down are usually somebody else's
        # network: a registry answering 403, a module proxy dropping a
        # stream. Fetching both here, with retries, means the builds that
        # follow find them locally instead of failing the whole gate on one
        # HTTP response.
        run: |
          set -euo pipefail
          hack/ci/retry.sh -- go mod download
          # From our mirror, by the same digest the Dockerfiles pin. Docker
          # Hub rate-limits a shared runner pool by IP, and a base image it
          # will not serve for longer than a retry window takes six required
          # contexts down on a change that is fine -- which is what happened
          # to #641.
          #
          # Best effort per image: the build has its own fallback, because
          # the FROM lines are unchanged and a missing override just goes to
          # Docker Hub. A warm step that failed the job would turn a mirror
          # that is merely behind into an outage of its own.
          while IFS=$'\t' read -r ref slug; do
            hack/ci/retry.sh -n 2 -d 5 -- docker pull "ghcr.io/${{ github.repository_owner }}/pgshard-base@${ref#*@}" \
              || echo "::warning::${slug} not available from the mirror; the build will fall back to Docker Hub"
          done < <(hack/ci/base-images.sh)
      - name: Build PostgreSQL image
        id: build_postgres
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-${{ matrix.pg }}
          load: true
        env:
          CI: "true"
      - name: Build operator and admin images
        id: build_control
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          # The overrides point every FROM at the mirrored copy of the same
          # digest. With none -- a fork without the mirror, or a base added
          # before the mirror workflow ran -- the Dockerfiles are unchanged
          # and the build goes to Docker Hub as before.
          mapfile -t mirror < <(hack/ci/mirror-args.sh)
          hack/ci/retry.sh -- docker buildx build "${mirror[@]}" --load -f Dockerfile.control --build-arg CMD=pgshard-operator -t pgshard-operator:e2e .
          hack/ci/retry.sh -- docker buildx build "${mirror[@]}" --load -f Dockerfile.control --build-arg CMD=pgshard-admin -t pgshard-admin:e2e .
          hack/ci/retry.sh -- docker buildx build "${mirror[@]}" --load -f Dockerfile.router -t pgshard-router:e2e .
      - name: Build controller image
        id: build_controller
        # Every cluster gets a controller from the operator now, not just
        # the suites that drive a workflow through one.
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          mapfile -t mirror < <(hack/ci/mirror-args.sh)
          hack/ci/retry.sh -- docker buildx build "${mirror[@]}" --load -f Dockerfile.control --build-arg CMD=pgshard-controller -t pgshard-controller:e2e .
      - name: Build the target-major PostgreSQL image
        id: build_postgres_target
        if: matrix.suite == 'upgrade' && needs.changes.outputs.code == 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-19
          load: true
        env:
          CI: "true"
      - name: Create kind cluster
        if: needs.changes.outputs.code == 'true'
        id: kind_up
        # A cluster that does not come up leaves nothing worth keeping, and
        # a second attempt cannot reuse the first one's half-built cluster.
        run: hack/ci/retry.sh -n 2 -d 15 -c hack/kind/down.sh -- hack/kind/up.sh
      - name: Load images into kind
        id: load_images
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
        run: hack/kind/load-images.sh pgshard-operator:e2e pgshard-admin:e2e pgshard-router:e2e "ghcr.io/andrew01234567890/pgshard-postgres:${PG_MAJOR}"
      - name: Load controller image into kind
        id: load_controller
        if: matrix.suite != 'smoke' && needs.changes.outputs.code == 'true'
        run: hack/kind/load-images.sh pgshard-controller:e2e
      - name: Load the target-major image into kind
        id: load_target
        if: matrix.suite == 'upgrade' && needs.changes.outputs.code == 'true'
        run: hack/kind/load-images.sh "ghcr.io/andrew01234567890/pgshard-postgres:19"
      - name: Run e2e suite
        if: needs.changes.outputs.code == 'true'
        id: run_suite
        run: |
          set -o pipefail
          mkdir -p "$E2E_ARTIFACTS"
          case "$E2E_SUITE" in
            smoke) go test -tags e2e -count=1 -v ./test/e2e/ 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            operator) go test -tags e2e -count=1 -v -timeout 70m ./test/e2e/operator/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            backup) go test -tags e2e -count=1 -v -timeout 70m ./test/e2e/backup/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            reshard) go test -tags e2e -count=1 -v -timeout 50m -skip 'TestReshardSplitUnderLoad|TestReshardMergeUnderLoad' ./test/e2e/reshard/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            reshard-split) go test -tags e2e -count=1 -v -timeout 110m -run 'TestReshardSplitUnderLoad' ./test/e2e/reshard/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            reshard-merge) go test -tags e2e -count=1 -v -timeout 110m -run 'TestReshardMergeUnderLoad' ./test/e2e/reshard/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            upgrade) go test -tags e2e -count=1 -v -timeout 110m ./test/e2e/upgrade/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            *) echo "unknown suite $E2E_SUITE" >&2; exit 1 ;;
          esac
        env:
          E2E_SUITE: ${{ matrix.suite }}
          ROUTER_IMAGE: pgshard-router:e2e
          OPERATOR_IMAGE: pgshard-operator:e2e
          ADMIN_IMAGE: pgshard-admin:e2e
          CONTROLLER_IMAGE: pgshard-controller:e2e
      - name: Say whether the cell reached its tests
        if: failure() && needs.changes.outputs.code == 'true'
        env:
          SUITE: ${{ matrix.suite }}
          PG: ${{ matrix.pg }}
          SUITE_OUTCOME: ${{ steps.run_suite.outcome }}
          SETUP_OUTCOMES: |
            check out the repository=${{ steps.checkout.outcome }}
            install Go=${{ steps.setup_go.outcome }}
            install kind=${{ steps.install_kind_retry.conclusion == 'skipped' && steps.install_kind.outcome || steps.install_kind_retry.outcome }}
            set up buildx=${{ steps.setup_buildx_retry.conclusion == 'skipped' && steps.setup_buildx.outcome || steps.setup_buildx_retry.outcome }}
            warm the module and base-image caches=${{ steps.warm_caches.outcome }}
            build PostgreSQL image=${{ steps.build_postgres.outcome }}
            build operator and admin images=${{ steps.build_control.outcome }}
            build controller image=${{ steps.build_controller.outcome }}
            build the target-major PostgreSQL image=${{ steps.build_postgres_target.outcome }}
            create kind cluster=${{ steps.kind_up.outcome }}
            load images into kind=${{ steps.load_images.outcome }}
            load controller image into kind=${{ steps.load_controller.outcome }}
            load the target-major image into kind=${{ steps.load_target.outcome }}
        # A cell that never reached its tests and one whose tests failed are
        # different findings, and the gate reports both as a red cell. An
        # image registry answering 403, or a module proxy dropping a stream,
        # says nothing about the product; reading a run should not require
        # opening the log to tell which happened.
        run: |
          set -uo pipefail
          failed_setup=$(printf '%s\n' "$SETUP_OUTCOMES" | grep '=failure$' | sed 's/=failure$//' | paste -sd', ' -)
          if [ -n "$failed_setup" ]; then
            echo "::error title=e2e setup failed::$SUITE on pg$PG never reached its tests: $failed_setup"
            echo "**e2e ($PG, $SUITE): setup failed** — never reached the tests: $failed_setup" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE_OUTCOME" = "failure" ]; then
            echo "::error title=e2e tests failed::$SUITE on pg$PG ran its tests and they failed"
            echo "**e2e ($PG, $SUITE): tests failed** — the suite ran and reported failures" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=e2e cell failed::$SUITE on pg$PG failed outside its setup and its tests"
            echo "**e2e ($PG, $SUITE): failed outside setup and tests**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect cluster state on failure
        if: failure() && needs.changes.outputs.code == 'true'
        run: |
          kubectl get all -A -o yaml > "$E2E_ARTIFACTS/all.yaml" || true
          kubectl get events -A --sort-by=.lastTimestamp > "$E2E_ARTIFACTS/events.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Delete kind cluster
        if: always() && needs.changes.outputs.code == 'true'
        run: hack/kind/down.sh

  gate:
    name: e2e gate
    # Aggregates the whole matrix, so a suite added to it is gated from the
    # moment it exists rather than when its cell name is added to branch
    # protection by hand.
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every e2e cell succeeded
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != "success" ]; then
            echo "::error::the e2e matrix did not succeed: $RESULT"
            exit 1
          fi
          echo "every e2e cell succeeded"
