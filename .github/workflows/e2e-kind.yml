name: e2e-kind

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (pg${{ matrix.pg }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.suite == 'upgrade' || matrix.suite == 'reshard-scale') && 120 || 80 }}
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]
        suite: [smoke, operator, backup, reshard]
        include:
          # The upgrade suite runs the online 18 -> 19 major upgrade, so it
          # needs both majors' images; the scale suite drives the
          # 1 -> 2 -> 4 -> 2 reshard under load. One major each keeps the
          # matrix inside the runner budget.
          - pg: 18
            suite: upgrade
          - pg: 18
            suite: reshard-scale
    env:
      PG_MAJOR: ${{ matrix.pg }}
      E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: matrix.suite != 'smoke'
      - name: Build PostgreSQL image
        if: matrix.suite != 'smoke'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-${{ matrix.pg }}
          load: true
        env:
          CI: "true"
      - name: Build operator and admin images
        if: matrix.suite != 'smoke'
        run: |
          docker build -f Dockerfile.control --build-arg CMD=pgshard-operator -t pgshard-operator:e2e .
          docker build -f Dockerfile.control --build-arg CMD=pgshard-admin -t pgshard-admin:e2e .
          docker build -f Dockerfile.router -t pgshard-router:e2e .
      - name: Build controller image
        if: matrix.suite == 'reshard' || matrix.suite == 'reshard-scale' || matrix.suite == 'upgrade'
        run: docker build -f Dockerfile.control --build-arg CMD=pgshard-controller -t pgshard-controller:e2e .
      - name: Build the target-major PostgreSQL image
        if: matrix.suite == 'upgrade'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          targets: postgres-19
          load: true
        env:
          CI: "true"
      - name: Create kind cluster
        run: hack/kind/up.sh
      - name: Load images into kind
        if: matrix.suite != 'smoke'
        run: hack/kind/load-images.sh pgshard-operator:e2e pgshard-admin:e2e pgshard-router:e2e "ghcr.io/andrew01234567890/pgshard-postgres:${PG_MAJOR}"
      - name: Load controller image into kind
        if: matrix.suite == 'reshard' || matrix.suite == 'reshard-scale' || matrix.suite == 'upgrade'
        run: hack/kind/load-images.sh pgshard-controller:e2e
      - name: Load the target-major image into kind
        if: matrix.suite == 'upgrade'
        run: hack/kind/load-images.sh "ghcr.io/andrew01234567890/pgshard-postgres:19"
      - name: Run e2e suite
        run: |
          set -o pipefail
          mkdir -p "$E2E_ARTIFACTS"
          case "$E2E_SUITE" in
            smoke) go test -tags e2e -count=1 -v -run 'Smoke' ./test/e2e/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            operator) go test -tags e2e -count=1 -v -timeout 70m ./test/e2e/operator/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            backup) go test -tags e2e -count=1 -v -timeout 70m ./test/e2e/backup/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            reshard) go test -tags e2e -count=1 -v -timeout 50m -skip 'TestReshard1To2To4To2UnderLoad' ./test/e2e/reshard/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            reshard-scale) go test -tags e2e -count=1 -v -timeout 110m -run 'TestReshard1To2To4To2UnderLoad' ./test/e2e/reshard/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            upgrade) go test -tags e2e -count=1 -v -timeout 110m ./test/e2e/upgrade/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log" ;;
            *) echo "unknown suite $E2E_SUITE" >&2; exit 1 ;;
          esac
        env:
          E2E_SUITE: ${{ matrix.suite }}
          ROUTER_IMAGE: pgshard-router:e2e
          OPERATOR_IMAGE: pgshard-operator:e2e
          ADMIN_IMAGE: pgshard-admin:e2e
          CONTROLLER_IMAGE: pgshard-controller:e2e
      - name: Collect cluster state on failure
        if: failure()
        run: |
          kubectl get all -A -o yaml > "$E2E_ARTIFACTS/all.yaml" || true
          kubectl get events -A --sort-by=.lastTimestamp > "$E2E_ARTIFACTS/events.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Delete kind cluster
        if: always()
        run: hack/kind/down.sh
