name: e2e-kind

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (pg${{ matrix.pg }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]
        suite: [smoke]
    env:
      PG_MAJOR: ${{ matrix.pg }}
      E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true
      - name: Create kind cluster
        run: hack/kind/up.sh
      - name: Run e2e suite
        run: |
          go test -tags e2e -count=1 -v -run 'Smoke' ./test/e2e/... 2>&1 | tee "$E2E_ARTIFACTS/go-test.log"
        env:
          E2E_SUITE: ${{ matrix.suite }}
      - name: Collect cluster state on failure
        if: failure()
        run: |
          kubectl get all -A -o yaml > "$E2E_ARTIFACTS/all.yaml" || true
          kubectl get events -A --sort-by=.lastTimestamp > "$E2E_ARTIFACTS/events.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-pg${{ matrix.pg }}-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Delete kind cluster
        if: always()
        run: hack/kind/down.sh
