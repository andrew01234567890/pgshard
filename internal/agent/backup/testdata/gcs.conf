# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=gcs
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-gcs-bucket=pgshard
repo1-gcs-key-type=service
repo1-gcs-key=CREDDIR/key.json
repo1-gcs-endpoint=http://fake-gcs.objectstores.svc:4443
repo1-storage-verify-tls=n
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y
expire-auto=n

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
