# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=azure
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-azure-account=devstoreaccount1
repo1-azure-container=pgshard
repo1-azure-key=Zm9v
repo1-azure-key-type=shared
repo1-azure-endpoint=http://azurite.objectstores.svc:10000
repo1-azure-uri-style=path
repo1-storage-verify-tls=n
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=detail
log-level-file=detail
process-max=2
start-fast=y
delta=y
expire-auto=n

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
