# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=azure
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-azure-account=acct
repo1-azure-container=pgshard
repo1-azure-key=sv=2020&sig=x
repo1-azure-key-type=sas
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
