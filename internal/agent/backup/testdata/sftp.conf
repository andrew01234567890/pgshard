# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=sftp
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-sftp-host=sftp.example.internal
repo1-sftp-host-user=backup
repo1-sftp-host-port=2222
repo1-sftp-private-key-file=CREDDIR/privateKey
repo1-sftp-host-key-check-type=none
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
