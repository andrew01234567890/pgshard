# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=s3
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-s3-bucket=pgshard
repo1-s3-endpoint=s3.eu-west-1.amazonaws.com
repo1-s3-region=eu-west-1
repo1-s3-key-type=web-id
repo1-storage-ca-file=/etc/ssl/ca.pem
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y
expire-auto=n

[demo-shard-0-pg19]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
