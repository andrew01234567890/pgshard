# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=gcs
repo1-path=/pgshard
repo1-bundle=y
repo1-block=y
repo1-retention-full=2
repo1-gcs-bucket=pgshard
repo1-gcs-key-type=auto
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y
expire-auto=n

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
