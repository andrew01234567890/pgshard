# Managed by pgshard-agent. Edits are overwritten.
[global]
repo1-type=s3
repo1-path=/demo
repo1-bundle=y
repo1-block=y
repo1-retention-full=3
repo1-retention-diff=4
repo1-s3-bucket=pgshard
repo1-s3-endpoint=http://minio.objectstores.svc:9000
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-s3-key-type=shared
repo1-s3-key=minioadmin
repo1-s3-key-secret=miniosecret
repo1-storage-verify-tls=n
archive-async=y
spool-path=/var/lib/pgbackrest/spool
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
process-max=2
start-fast=y
delta=y
expire-auto=n

[demo-catalog-pg18]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/tmp
pg1-user=postgres
