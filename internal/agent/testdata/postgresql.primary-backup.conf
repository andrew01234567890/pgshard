# Managed by pgshard-agent. Edits are overwritten.
archive_command = 'pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=demo-s0-pg18 archive-push %p'
archive_mode = on
archive_timeout = '5min'
hot_standby = on
hot_standby_feedback = off
listen_addresses = '*'
max_active_replication_origins = 16
max_logical_replication_workers = 24
max_prepared_transactions = 200
max_replication_slots = 16
max_sync_workers_per_subscription = 2
max_wal_senders = 16
max_worker_processes = 32
password_encryption = 'scram-sha-256'
port = 5432
restart_after_crash = off
restore_command = 'pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=demo-s0-pg18 archive-get %f "%p"'
ssl = off
synchronous_commit = on
synchronous_standby_names = 'ANY 1 (s0-1, s0-2)'
track_commit_timestamp = on
unix_socket_directories = '/tmp'
wal_keep_size = '512MB'
wal_level = logical
wal_log_hints = on
wal_receiver_timeout = '5s'
wal_sender_timeout = '5s'
include_if_exists = 'pgshard.override.conf'
include_if_exists = 'pgshard.slots.conf'
