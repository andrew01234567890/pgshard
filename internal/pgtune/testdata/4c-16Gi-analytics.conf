# Derived by pgshard; do not edit. Reasons follow each setting.
autovacuum_max_workers = 3	# cpu/2 clamped to [3,10]
autovacuum_naptime = '15s'	# wake often so small hot tables are vacuumed promptly
autovacuum_vacuum_cost_limit = 2000	# mixed/analytics: vacuum aggressively between batches
autovacuum_work_mem = '1GB'	# same budget as maintenance_work_mem, one per autovacuum worker
checkpoint_completion_target = 0.9	# spread checkpoint writes over the interval
default_toast_compression = lz4	# faster than pglz for the same class of data
effective_cache_size = '12GB'	# 75% of the memory limit; the kernel page cache is counted
effective_io_concurrency = 200	# ssd (or unknown) storage class serves many concurrent requests
huge_pages = try	# use huge pages when the node offers them, never fail startup
idle_in_transaction_session_timeout = '10min'	# idle transactions pin xmin and hold locks
idle_replication_slot_timeout = '24h'	# drop abandoned slots before they fill the disk
io_method = worker	# PostgreSQL 18 asynchronous I/O through worker processes
io_workers = 3	# cpu/2 clamped to [3,32]
jit = on	# analytics: long queries amortise compilation
log_checkpoints = on	# checkpoint timing is the first thing to look at under I/O pressure
log_lock_waits = on	# surface waits past deadlock_timeout
log_min_duration_statement = '5000ms'	# mixed/analytics: batch queries are expected to run long
logical_decoding_work_mem = '64MB'	# 64MiB per decoding slot, budgeted for 4 slots within memory/8
maintenance_work_mem = '1GB'	# min(2GiB, memory/16)
max_connections = 108	# pooler backend budget 100 plus 8 reserved for superuser and the agent
max_parallel_maintenance_workers = 1	# cpu/4 for index builds and vacuum
max_parallel_workers = 4	# one parallel worker per core
max_parallel_workers_per_gather = 2	# analytics: cpu/2 workers per gather
max_prepared_transactions = 108	# one prepared transaction per connection for two-phase commit
max_replication_slots = 14	# replicas 2 + logical slots 4 + 8 headroom
max_slot_wal_keep_size = '20GB'	# default when the disk size is unknown
max_wal_senders = 16	# max_replication_slots + 2 for base backups
max_wal_size = '4GB'	# default when the disk size is unknown
max_worker_processes = 8	# max(8, cpu×2): room for parallel workers, logical workers and extensions
min_wal_size = '1GB'	# keep recycled segments to avoid churn
password_encryption = 'scram-sha-256'	# no md5 passwords
random_page_cost = 1.1	# ssd (or unknown) storage class: random reads cost almost as little as sequential
shared_buffers = '4GB'	# 25% of the memory limit, capped at 16GiB
shared_preload_libraries = pg_stat_statements	# query statistics for the admin CLI
ssl = on	# TLS between every process
standard_conforming_strings = on	# the router parses shard keys out of string literals with it on; a shard that read them differently would hold rows the router looks for elsewhere
synchronous_commit = on	# durability floor; the agent raises it via synchronous_standby_names
track_commit_timestamp = on	# commit timestamps are needed for conflict resolution
wal_buffers = '16MB'	# 16MiB is the ceiling PostgreSQL benefits from
wal_compression = zstd	# cheap CPU for smaller full-page images
wal_level = logical	# logical decoding is required for resharding
work_mem = '21MB'	# (memory - shared_buffers - maintenance - decoding - overhead) / (100 backends × 4 sorts)
