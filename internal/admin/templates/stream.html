{{template "head" .Name}}

<nav class="tabs" aria-label="Sections"><a href="/">Clusters</a><a href="/backups">Backups</a><a href="/migrations">Migrations</a><a href="/streams" aria-current="page">Streams</a></nav>
<div id="streams" data-live hx-get="/streams/{{.Name}}" hx-trigger="topology" hx-swap="innerHTML" aria-live="polite">

</div>
<p class="notice"><a href="/api/v1/streams/{{.Name}}">JSON</a></p>
<script src="/static/app.js" defer></script>
{{template "foot"}}
