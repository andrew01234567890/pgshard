apiVersion: v1
kind: Namespace
metadata:
  name: pgshard-chaos
---
apiVersion: v1
kind: Pod
metadata:
  name: chaos-dummy
  namespace: pgshard-chaos
  labels:
    app: chaos-dummy
spec:
  containers:
    - name: pause
      image: busybox:1.37.0
      command: ["sleep", "3600"]
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: noop-pod-kill
  namespace: pgshard-chaos
spec:
  action: pod-kill
  mode: one
  duration: 10s
  selector:
    namespaces:
      - pgshard-chaos
    labelSelectors:
      app: chaos-dummy
