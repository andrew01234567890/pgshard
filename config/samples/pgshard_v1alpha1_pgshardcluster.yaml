apiVersion: pgshard.io/v1alpha1
kind: PgShardCluster
metadata:
  name: demo
spec:
  internalTLS:
    # Unsupported outside development; use secretRef with real TLS material.
    insecure: true
  postgresql:
    major: 18
  catalog:
    replicas: 3
    storage:
      size: 1Gi
  shards: 1
  replicasPerShard: 3
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
