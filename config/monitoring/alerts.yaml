# PrometheusRule-style alert definitions for pgshard. Apply with a
# Prometheus Operator (kubectl apply -f alerts.yaml) or copy the groups into
# a plain Prometheus rule_files entry. See docs/observability.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pgshard
  labels:
    app.kubernetes.io/part-of: pgshard
spec:
  groups:
    - name: pgshard-transactions
      rules:
        - alert: PgshardTwoPCInDoubtAged
          expr: pgshard_controller_in_doubt_oldest_age_seconds > 300
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: In-doubt two-phase commits are not resolving
            description: >-
              The oldest undecided row in pgshard.xact_decisions is older
              than 5 minutes; the resolver is stuck or cannot reach a
              participant. Prepared transactions pin WAL and vacuum on the
              participants until resolved.
        - alert: PgshardPreparedTransactionsHigh
          expr: pgshard_controller_in_doubt_transactions > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The 2PC decision log is unusually large
            description: >-
              More than 100 undecided decision-log rows; commit throughput
              may be limited by prepared-transaction cleanup.
    - name: pgshard-replication
      rules:
        - alert: PgshardReplicationLagHigh
          expr: pgshard_agent_replication_lag_bytes > 128 * 1024 * 1024
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A standby is far behind its primary
            description: Replay lag exceeded 128 MiB for 5 minutes.
        - alert: PgshardSlotWALRetention
          expr: pgshard_agent_slot_wal_status{wal_status=~"unreserved|lost"} == 1
          labels:
            severity: critical
          annotations:
            summary: A replication slot is losing WAL
            description: >-
              A slot's wal_status left "reserved"/"extended": WAL retention
              is beyond max_slot_wal_keep_size and the slot is about to be
              (or was) invalidated. Change streams and standbys using it
              will need a rebuild once it is lost.
        - alert: PgshardStreamLagHigh
          expr: pgshard_pooler_stream_lag_bytes > 256 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A change-stream consumer is far behind
            description: The stream reader acked position trails the server WAL end by more than 256 MiB.
    - name: pgshard-backups
      rules:
        - alert: PgshardBackupStale
          expr: pgshard_agent_backup_last_age_seconds > 26 * 3600
          labels:
            severity: critical
          annotations:
            summary: Backups are stale
            description: The newest completed pgBackRest backup is older than 26 hours.
        - alert: PgshardBackupFailed
          expr: pgshard_agent_backup_last_result{result="error"} == 1
          labels:
            severity: critical
          annotations:
            summary: The last backup attempt failed
            description: >-
              pgBackRest reported an error (including ArchiveDuplicateError
              after a timeline mix-up); check the agent logs and the stanza
              with pgbackrest info/verify.
    - name: pgshard-control-plane
      rules:
        - alert: PgshardOperatorReconcileErrors
          expr: rate(controller_runtime_reconcile_errors_total[5m]) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The operator is failing to reconcile
            description: controller-runtime reconcile errors are persistent; check the operator logs.
        - alert: PgshardCutoverStepStalled
          expr: max by (kind, id, stage, step) (pgshard_controller_workflow_step_age_seconds) > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A cutover step has stopped advancing
            description: >-
              {{ $labels.kind }} workflow {{ $labels.id }} has been on step
              {{ $labels.step }} of {{ $labels.stage }} for more than fifteen
              minutes. A step past the journal is retried without a timeout or
              an attempt limit, so writes can stay fenced while the workflow
              still looks like it is running. Read the controller log for
              "cutover step is not advancing".
        - alert: PgshardTwoPCDecidedUnfinished
          expr: max by (decision) (pgshard_controller_decided_oldest_age_seconds) > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A decided two-phase transaction is still not finished
            description: >-
              A {{ $labels.decision }} decision has waited more than five
              minutes for the resolver to finish it on every participant.
              The row is deleted as soon as it is finished, so one that
              outlives its decision is holding locks, WAL and a vacuum
              horizon on each participant meanwhile. Check
              pgshard_controller_resolver_unresolved and the resolver logs.
        - alert: PgshardCutoverPauseTooLong
          # Not "for:", because a cutover pause is a moment that has already
          # happened by the time it is measured; waiting to see it persist
          # would mean never firing.
          expr: pgshard_controller_cutover_pause_seconds > 2
          labels:
            severity: warning
          annotations:
            summary: A cutover paused writes for longer than expected
            description: >-
              {{ $labels.kind }} workflow {{ $labels.id }} held writes for
              {{ $value }}s at its cutover. This is the one moment a reshard
              is visible to a workload, and nothing reported it before:
              pgshard_controller_cutover_paused counts workflows held at a
              CONFIGURED pause point, which is a different thing. The guide
              documents a sub-second pause; the threshold here is 2s because
              pauses above the documented bound have been observed on small
              runners and whether the guarantee or the implementation is
              wrong is not yet settled. Treat a value near the threshold as
              a question, not noise.
        - alert: PgshardCutoverPaused
          expr: pgshard_controller_cutover_paused > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: A workflow is held at a configured cutover pause
            description: >-
              {{ $labels.kind }} workflow {{ $labels.id }} on shard set
              {{ $labels.shard_set }} has waited more than 30 minutes at its
              configured pause before {{ $labels.pause }}; it proceeds only
              when an operator lets it. Workflows an operator paused outright
              are pgshard_controller_workflows{state="paused"} instead.
