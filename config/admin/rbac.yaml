apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgshard-admin
rules:
  - apiGroups: ["pgshard.io"]
    resources: ["pgshardclusters", "pgshardgroups", "pgshardbackuppolicies", "pgshardbackups", "pgshardrestores", "pgshardreshards"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgshard-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgshard-admin
subjects:
  - kind: ServiceAccount
    name: pgshard-admin
    namespace: pgshard-system
