apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgshard-admin
  namespace: pgshard-system
  labels:
    app.kubernetes.io/name: pgshard-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgshard-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgshard-admin
    spec:
      serviceAccountName: pgshard-admin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: token
          secret:
            secretName: pgshard-admin
      containers:
        - name: admin
          image: ghcr.io/andrew01234567890/pgshard-admin:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen=:8081
            # Everything the admin serves is operational detail about the
            # cluster, so it is credentialed. Create the Secret first:
            #   kubectl create secret generic pgshard-admin \
            #     --from-literal=token="$(openssl rand -hex 24)"
            - --token-file=/etc/pgshard-admin/token
          volumeMounts:
            - name: token
              mountPath: /etc/pgshard-admin
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pgshard-admin
  namespace: pgshard-system
  labels:
    app.kubernetes.io/name: pgshard-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgshard-admin
  ports:
    - name: http
      port: 8081
      targetPort: http
