apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgshard-operator
  namespace: pgshard-system
  labels:
    app.kubernetes.io/name: pgshard-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgshard-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgshard-operator
    spec:
      serviceAccountName: pgshard-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/andrew01234567890/pgshard-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 10
