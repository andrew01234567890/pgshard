                      format: int64
                      type: integer
                  required:
                  - group
                  - reachedTarget
                  - sourceStanza
                  type: object
                type: array
              phase:
                type: string
              reconciliation:
                description: |-
                  RestoreReconciliationStatus is the outcome of finishing prepared
                  transactions after a barrier restore.
                properties:
                  committed:
                    format: int32
                    type: integer
                  contradictions:
                    description: |-
