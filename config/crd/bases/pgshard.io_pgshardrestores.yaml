    schema:
      openAPIV3Schema:
        description: PgShardRestore is a restore run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PgShardRestoreSpec requests a restore: a new cluster is created from the
              source cluster's repository and every group recovers to the same target.
              A barrier target is the only cluster-consistent one.
              A restore is one operation, and it starts the moment the child cluster
              is created from it. Its recovery target is serialized into that cluster
              at creation, but whether the operator runs the barrier's two-phase
              reconciliation afterwards is read from the live spec -- so turning a
              plain restore into a barrier one after the child exists would have the
              operator resolve prepared transactions against a cluster recovered to
              the original, uncertified point. Immutable for the same reason a backup
              is, and more urgently.
            properties:
              backupId:
                description: |-
                  BackupID pins the backup set: the name of a completed PgShardBackup of
                  the source cluster (each group restores its own set), or a raw
                  pgBackRest label applied to every group. Required for name, xid,
                  barrier and immediate targets (pick a backup taken before the
                  barrier); time and lsn targets select the set automatically.
                type: string
              clusterName:
                description: ClusterName is the source cluster whose repository is
                  restored from.
                type: string
              clusterSpec:
                description: |-
                  ClusterSpec is the spec of the new cluster; when unset the source
                  cluster's spec is copied. It must keep the source's shard count and
                  PostgreSQL major, and it must bind a backup policy that reaches the
                  source repository (the source policy when unset).
