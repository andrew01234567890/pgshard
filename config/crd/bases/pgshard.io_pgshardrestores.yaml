                    properties:
                      enabled:
                        default: true
                        type: boolean
                      insecureNoAuth:
                        description: |-
                          InsecureNoAuth serves the admin to anything that can reach its
                          Service. It has no mutations, but everything it shows -- topology,
                          backup and restore state, stream positions, two-phase commit
                          identifiers, the text of DDL -- is operational detail about the
                          cluster, so it is credentialed unless this says otherwise.
                        type: boolean
                    type: object
                  backup:
                    description: BackupSpec links the cluster to a PgShardBackupPolicy.
                    properties:
                      policyRef:
                        type: string
                    type: object
                  catalog:
                    description: CatalogSpec configures the control-plane catalog
                      group.
                    properties:
                      replicas:
                        default: 3
                        minimum: 1
                        type: integer
                      storage:
                        description: StorageSpec describes a persistent volume request.
                        properties:
                          size:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
