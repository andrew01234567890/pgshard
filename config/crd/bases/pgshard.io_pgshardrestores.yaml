                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: 'internalTLS requires secretRef, or insecure: true
                        to explicitly opt into plaintext (unsupported outside development)'
                      rule: (has(self.secretRef) && self.secretRef.name != "") ||
                        (has(self.insecure) && self.insecure)
                    - message: internalTLS.secretRef and internalTLS.insecure are
                        mutually exclusive
