---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgshardrestores.pgshard.io
spec:
  group: pgshard.io
  names:
    kind: PgShardRestore
    listKind: PgShardRestoreList
    plural: pgshardrestores
    singular: pgshardrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Source
      type: string
    - jsonPath: .spec.newClusterName
      name: New
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PgShardRestore is a restore run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PgShardRestoreSpec requests a restore: a new cluster is created from the
              source cluster's repository and every group recovers to the same target.
              A barrier target is the only cluster-consistent one.
            properties:
              backupId:
                description: |-
                  BackupID pins the backup set: the name of a completed PgShardBackup of
                  the source cluster (each group restores its own set), or a raw
                  pgBackRest label applied to every group. Required for name, xid,
                  barrier and immediate targets (pick a backup taken before the
                  barrier); time and lsn targets select the set automatically.
                type: string
              clusterName:
                description: ClusterName is the source cluster whose repository is
                  restored from.
                type: string
              clusterSpec:
                description: |-
                  ClusterSpec is the spec of the new cluster; when unset the source
                  cluster's spec is copied. It must keep the source's shard count and
                  PostgreSQL major, and it must bind a backup policy that reaches the
                  source repository (the source policy when unset).
                properties:
                  admin:
                    default: {}
                    description: AdminSpec toggles the admin API.
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      insecureNoAuth:
                        description: |-
                          InsecureNoAuth serves the admin to anything that can reach its
                          Service. It has no mutations, but everything it shows -- topology,
                          backup and restore state, stream positions, two-phase commit
                          identifiers, the text of DDL -- is operational detail about the
                          cluster, so it is credentialed unless this says otherwise.
                        type: boolean
                    type: object
                  backup:
                    description: BackupSpec links the cluster to a PgShardBackupPolicy.
                    properties:
                      policyRef:
                        type: string
                    type: object
                  catalog:
                    description: CatalogSpec configures the control-plane catalog
                      group.
                    properties:
                      replicas:
                        default: 3
                        minimum: 1
                        type: integer
                      storage:
                        description: StorageSpec describes a persistent volume request.
                        properties:
                          size:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          storageClassName:
                            type: string
                        required:
                        - size
                        type: object
                    required:
                    - storage
                    type: object
                  durability:
                    default: {}
                    description: DurabilitySpec configures synchronous replication.
                    properties:
                      minSyncStandbys:
                        default: 1
                        description: |-
                          MinSyncStandbys is the number of synchronous standby acknowledgements
                          every commit requires (ANY n). It must be at least 1: asynchronous
                          durability (0) is not supported, because automatic failover could then
                          promote a standby that never acknowledged a committed write and lose it.
                        minimum: 1
                        type: integer
                      synchronousCommit:
                        default: "on"
                        enum:
                        - "on"
                        - remote_apply
                        type: string
                    type: object
                  internalTLS:
                    description: |-
                      InternalTLS configures mutual TLS between routers and the pooler
                      sidecars. Either secretRef (a Secret with tls.crt, tls.key and
                      ca.crt) or the explicit insecure override must be set; there is no
                      implicit plaintext fallback.
                    properties:
                      insecure:
                        description: |-
                          Insecure runs the pooler port as plaintext gRPC. Unsupported outside
                          development; the network must be protected by other means.
                        type: boolean
                      secretRef:
                        description: |-
                          SecretRef names a Secret with tls.crt, tls.key and ca.crt; the
                          poolers refuse clients whose certificate does not chain to ca.crt
                          and the routers dial with the certificate.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: 'internalTLS requires secretRef, or insecure: true
                        to explicitly opt into plaintext (unsupported outside development)'
                      rule: (has(self.secretRef) && self.secretRef.name != "") ||
                        (has(self.insecure) && self.insecure)
                    - message: internalTLS.secretRef and internalTLS.insecure are
                        mutually exclusive
                      rule: '!((has(self.secretRef) && self.secretRef.name != "")
                        && has(self.insecure) && self.insecure)'
                  networkPolicy:
                    default: {}
                    description: NetworkPolicySpec renders a NetworkPolicy in front
                      of the member pods.
                    properties:
                      clients:
                        description: |-
                          Clients are peers admitted to a member's PostgreSQL, agent and pooler
                          ports on top of the cluster's own pods, and enabling the policy
                          requires at least one: the operator dials the agent and the pooler
                          from its own namespace, and the controller dials the catalog, so a
                          policy that names neither takes the cluster away from its control
                          plane. Probe and metrics ports are never restricted, so the kubelet
                          and a scraper need no entry here.
                        items:
                          description: |-
                            NetworkPolicyPeer describes a peer to allow traffic to/from. Only certain combinations of
                            fields are allowed
                          properties:
                            ipBlock:
                              description: |-
                                ipBlock defines policy on a particular IPBlock. If this field is set then
                                neither of the other fields can be.
                              properties:
                                cidr:
                                  description: |-
                                    cidr is a string representing the IPBlock
                                    Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                                  type: string
                                except:
                                  description: |-
                                    except is a slice of CIDRs that should not be included within an IPBlock
                                    Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                                    Except values will be rejected if they are outside the cidr range
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - cidr
                              type: object
                            namespaceSelector:
                              description: |-
                                namespaceSelector selects namespaces using cluster-scoped labels. This field follows
                                standard label selector semantics; if present but empty, it selects all namespaces.

                                If podSelector is also set, then the NetworkPolicyPeer as a whole selects
                                the pods matching podSelector in the namespaces selected by namespaceSelector.
                                Otherwise it selects all pods in the namespaces selected by namespaceSelector.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                            podSelector:
                              description: |-
                                podSelector is a label selector which selects pods. This field follows standard label
                                selector semantics; if present but empty, it selects all pods.

                                If namespaceSelector is also set, then the NetworkPolicyPeer as a whole selects
                                the pods matching podSelector in the Namespaces selected by NamespaceSelector.
                                Otherwise it selects the pods matching podSelector in the policy's own namespace.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                        type: array
                      enabled:
                        description: |-
                          Enabled renders the policy. It is off by default: a NetworkPolicy is
                          worth nothing under a CNI that does not enforce one, and one that
                          fails to name a client of a member's PostgreSQL takes that client off
                          the cluster with no diagnostic beyond a refused connection.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: 'networkPolicy.clients must name the control plane:
                        the operator and the controller reach a member from outside
                        the cluster''s own pods, and a policy without them fences
                        the cluster off from what runs it'
                      rule: '!has(self.enabled) || !self.enabled || (has(self.clients)
                        && size(self.clients) > 0)'
                  postgresql:
                    description: |-
                      PostgreSQLSpec selects the PostgreSQL build and its base configuration.

                      A prerelease major has to be asked for by name. PostgreSQL 19 is Beta 3,
                      which upstream says is not intended for production and may contain
                      serious bugs, and `major: 19` on its own reads like any other supported
                      choice while resolving to the moving pgshard-postgres:19 tag. Naming the
                      image is what turns that into a decision somebody made: it is the same
                      opt-in whichever image is named, since what is being asked for is the
                      acknowledgement, not a particular tag.
                    properties:
                      image:
                        type: string
                      major:
                        enum:
                        - 18
                        - 19
                        type: integer
                      parameters:
                        additionalProperties:
                          type: string
                        description: |-
                          Parameters are extra postgresql.conf settings. A key must be a
                          PostgreSQL setting name and nothing else: the agent writes the name
                          as it stands, so one carrying a newline would write a second setting
                          of its own and defeat every rule below, which names settings.

                          Keys that pgshard owns (fsync, full_page_writes, wal_level,
                          max_prepared_transactions, ssl, synchronous_commit) are rejected,
                          and so are the settings that make PostgreSQL run a command:
                          archive_command, restore_command, archive_cleanup_command and
                          recovery_end_command each execute in the member pod, and pgshard
                          sets the ones it needs itself.
                        type: object
                        x-kubernetes-validations:
                        - message: every parameter key must be a PostgreSQL setting
                            name
                          rule: self.all(k, k.matches('^[A-Za-z_][A-Za-z0-9_.]*$'))
                        - message: parameters must not set archive_command
                          rule: '!(''archive_command'' in self)'
                        - message: parameters must not set restore_command
                          rule: '!(''restore_command'' in self)'
                        - message: parameters must not set archive_cleanup_command
                          rule: '!(''archive_cleanup_command'' in self)'
                        - message: parameters must not set recovery_end_command
                          rule: '!(''recovery_end_command'' in self)'
                        - message: parameters must not set fsync
                          rule: '!(''fsync'' in self)'
                        - message: parameters must not set full_page_writes
                          rule: '!(''full_page_writes'' in self)'
                        - message: parameters must not set wal_level
                          rule: '!(''wal_level'' in self)'
                        - message: parameters must not set max_prepared_transactions
                          rule: '!(''max_prepared_transactions'' in self)'
                        - message: parameters must not set ssl
                          rule: '!(''ssl'' in self)'
                        - message: parameters must not set synchronous_commit
                          rule: '!(''synchronous_commit'' in self)'
                      profile:
                        default: oltp
                        enum:
                        - oltp
                        - mixed
                        - analytics
                        type: string
                    required:
                    - major
                    type: object
                    x-kubernetes-validations:
                    - message: 'PostgreSQL 19 is a beta and is not intended for production:
                        set postgresql.image to the 19 image you mean (for example
                        ghcr.io/andrew01234567890/pgshard-postgres:19beta3) to say
                        so deliberately'
                      rule: self.major != 19 || has(self.image)
                  replicasPerShard:
                    default: 3
                    minimum: 1
                    type: integer
                  resharding:
                    default: {}
                    description: ReshardingSpec controls resharding behaviour.
                    properties:
                      pauseBefore:
                        default: none
                        enum:
                        - none
                        - switchWrites
                        - complete
                        type: string
                      retireOldGroupsAfter:
                        default: 24h
                        type: string
                    type: object
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  router:
                    default:
                      maxReplicas: 10
                      minReplicas: 2
                    description: RouterSpec configures the stateless router deployment.
                    properties:
                      hpa:
                        default: {}
                        description: HPASpec configures router autoscaling.
                        properties:
                          cpuUtilization:
                            default: 70
                            maximum: 100
                            minimum: 1
                            type: integer
                        type: object
                      maxReplicas:
                        default: 10
                        minimum: 1
                        type: integer
                      minReplicas:
                        default: 2
                        minimum: 1
                        type: integer
                      tls:
                        description: TLSSpec references a TLS Secret.
                        properties:
                          secretRef:
                            description: |-
                              LocalObjectReference contains enough information to let you locate the
                              referenced object inside the same namespace.
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: router.maxReplicas must be >= router.minReplicas
                      rule: self.maxReplicas >= self.minReplicas
                  shards:
                    minimum: 1
                    type: integer
                  storage:
                    description: StorageSpec describes a persistent volume request.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                    required:
                    - size
                    type: object
                  unsafeSingleReplica:
                    description: |-
                      UnsafeSingleReplica relaxes the replicasPerShard and catalog.replicas
                      >= 3 requirement so test and development clusters can run one member
                      per group. Single-member groups have no synchronous standby and no
                      failover candidate: unsupported for production.
                    type: boolean
                  upgrade:
                    default: {}
                    description: UpgradeSpec controls major-version upgrades.
                    properties:
                      maxParallelGroups:
                        default: 1
                        minimum: 1
                        type: integer
                      strategy:
                        default: online
                        enum:
                        - online
                        - offline
                        type: string
                    type: object
                required:
                - catalog
                - internalTLS
                - postgresql
                - storage
                type: object
                x-kubernetes-validations:
                - message: replicasPerShard must be >= 3
                  rule: self.replicasPerShard >= 3 || (has(self.unsafeSingleReplica)
                    && self.unsafeSingleReplica)
                - message: catalog.replicas must be >= 3 for HA
                  rule: self.catalog.replicas >= 3 || (has(self.unsafeSingleReplica)
                    && self.unsafeSingleReplica)
              exclusive:
                description: Exclusive stops recovery just before the target.
                type: boolean
              newClusterName:
                description: NewClusterName names the PgShardCluster the restore creates.
                minLength: 1
                type: string
              target:
                description: |-
                  Target selects the recovery point; unset recovers to the end of the
                  archived WAL. The same target applies to every group.
                properties:
                  barrier:
                    description: |-
                      Barrier names a certified barrier: every group recovers to the WAL
                      restore point pgshard-<barrier>, the new cluster stays write-fenced
                      until its prepared transactions are reconciled against the restored
                      decision log, and the restore fails on any contradiction.
                    type: string
                  immediate:
                    type: boolean
                  lsn:
                    type: string
                  name:
                    type: string
                  time:
                    format: date-time
                    type: string
                  xid:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at most one of target.time, target.lsn, target.name, target.xid,
                    target.immediate, target.barrier may be set
                  rule: '[has(self.time), has(self.lsn), has(self.name), has(self.xid),
                    has(self.immediate) && self.immediate, has(self.barrier)].filter(x,
                    x).size() <= 1'
              targetTLI:
                description: TargetTLI is the timeline to follow (recovery_target_timeline).
                format: int64
                minimum: 1
                type: integer
            required:
            - clusterName
            - newClusterName
            type: object
            x-kubernetes-validations:
            - message: newClusterName must differ from clusterName
              rule: self.newClusterName != self.clusterName
            - message: target.name, target.xid, target.barrier and target.immediate
                require backupId
              rule: '!(has(self.target) && (has(self.target.name) || has(self.target.xid)
                || has(self.target.barrier) || (has(self.target.immediate) && self.target.immediate)))
                || (has(self.backupId) && self.backupId.size() > 0)'
          status:
            description: PgShardRestoreStatus is the observed state of a restore.
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                type: string
              groups:
                items:
                  description: GroupRestoreStatus is the progress of one group of
                    the new cluster.
                  properties:
                    backupId:
                      type: string
                    group:
                      type: string
                    message:
                      type: string
                    preparedTransactions:
                      description: |-
                        PreparedTransactions are the pgshard transaction ids the group still
                        holds prepared after recovery; only filled for non-barrier targets.
                      items:
                        type: string
                      type: array
                    reachedTarget:
                      description: |-
                        ReachedTarget is true once the group's primary finished recovery and
                        promoted; PostgreSQL refuses to promote before the target is reached.
                      type: boolean
                    sourceStanza:
                      description: SourceStanza is the repository stanza the group
                        restored from.
                      type: string
                    timeline:
                      description: Timeline is the new primary's timeline once it
