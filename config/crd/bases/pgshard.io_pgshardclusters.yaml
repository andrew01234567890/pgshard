                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: 'internalTLS requires secretRef, or insecure: true to explicitly
                    opt into plaintext (unsupported outside development)'
                  rule: (has(self.secretRef) && self.secretRef.name != "") || (has(self.insecure)
                    && self.insecure)
                - message: internalTLS.secretRef and internalTLS.insecure are mutually
                    exclusive
                  rule: '!((has(self.secretRef) && self.secretRef.name != "") && has(self.insecure)
                    && self.insecure)'
                - message: 'internalTLS.agentMTLS needs secretRef: the agents require
                    the certificates it names'
                  rule: '!(has(self.agentMTLS) && self.agentMTLS) || (has(self.secretRef)
                    && self.secretRef.name != "")'
