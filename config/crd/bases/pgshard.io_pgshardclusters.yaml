---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgshardclusters.pgshard.io
spec:
  group: pgshard.io
  names:
    kind: PgShardCluster
    listKind: PgShardClusterList
    plural: pgshardclusters
    shortNames:
    - psc
    singular: pgshardcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.shards
      name: Shards
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PgShardCluster is a sharded PostgreSQL cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PgShardClusterSpec is the desired state of a PgShardCluster.
            properties:
              admin:
                default: {}
                description: AdminSpec toggles the admin API.
                properties:
                  enabled:
                    default: true
                    type: boolean
                type: object
              backup:
                description: BackupSpec links the cluster to a PgShardBackupPolicy.
                properties:
                  policyRef:
                    type: string
                type: object
              catalog:
                description: CatalogSpec configures the control-plane catalog group.
                properties:
                  replicas:
                    default: 3
                    minimum: 1
                    type: integer
                  storage:
                    description: StorageSpec describes a persistent volume request.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                    required:
                    - size
                    type: object
                required:
                - storage
                type: object
              durability:
                default: {}
                description: DurabilitySpec configures synchronous replication.
                properties:
                  minSyncStandbys:
                    default: 1
                    minimum: 0
                    type: integer
                  synchronousCommit:
                    default: "on"
                    enum:
                    - "on"
                    - remote_apply
                    type: string
                type: object
              internalTLS:
                description: |-
                  InternalTLS references a Secret with tls.crt, tls.key and ca.crt used
                  for mutual TLS between routers and the pooler sidecars. When set, the
                  poolers refuse clients whose certificate does not chain to ca.crt and
                  the routers dial with the certificate; when unset the pooler port
                  speaks plaintext gRPC and must be protected by network policy.
                properties:
                  secretRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              postgresql:
                description: PostgreSQLSpec selects the PostgreSQL build and its base
                  configuration.
                properties:
                  image:
                    type: string
                  major:
                    enum:
                    - 18
                    - 19
                    type: integer
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      Parameters are extra postgresql.conf settings. Keys that pgshard owns
                      (fsync, full_page_writes, wal_level, max_prepared_transactions, ssl,
                      synchronous_commit) are rejected.
                    type: object
                    x-kubernetes-validations:
                    - message: parameters must not set fsync
                      rule: '!(''fsync'' in self)'
                    - message: parameters must not set full_page_writes
                      rule: '!(''full_page_writes'' in self)'
                    - message: parameters must not set wal_level
                      rule: '!(''wal_level'' in self)'
                    - message: parameters must not set max_prepared_transactions
                      rule: '!(''max_prepared_transactions'' in self)'
                    - message: parameters must not set ssl
                      rule: '!(''ssl'' in self)'
                    - message: parameters must not set synchronous_commit
                      rule: '!(''synchronous_commit'' in self)'
                  profile:
                    default: oltp
                    enum:
                    - oltp
                    - mixed
                    - analytics
                    type: string
                required:
                - major
                type: object
              replicasPerShard:
                default: 3
                minimum: 1
                type: integer
              resharding:
                default: {}
                description: ReshardingSpec controls resharding behaviour.
                properties:
                  pauseBefore:
                    default: none
                    enum:
                    - none
                    - switchWrites
                    - complete
                    type: string
                  retireOldGroupsAfter:
                    default: 24h
                    type: string
                type: object
              resources:
                description: ResourceRequirements describes the compute resource requirements.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              router:
                default:
                  maxReplicas: 10
                  minReplicas: 2
                description: RouterSpec configures the stateless router deployment.
                properties:
                  hpa:
                    default: {}
                    description: HPASpec configures router autoscaling.
                    properties:
                      cpuUtilization:
                        default: 70
                        maximum: 100
                        minimum: 1
                        type: integer
                    type: object
                  maxReplicas:
                    default: 10
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 2
                    minimum: 1
                    type: integer
                  tls:
                    description: TLSSpec references a TLS Secret.
                    properties:
                      secretRef:
                        description: |-
                          LocalObjectReference contains enough information to let you locate the
                          referenced object inside the same namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                type: object
                x-kubernetes-validations:
                - message: router.maxReplicas must be >= router.minReplicas
                  rule: self.maxReplicas >= self.minReplicas
              shards:
                minimum: 1
                type: integer
              storage:
                description: StorageSpec describes a persistent volume request.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    type: string
                required:
                - size
                type: object
              unsafeSingleReplica:
                description: |-
                  UnsafeSingleReplica relaxes the replicasPerShard and catalog.replicas
                  >= 3 requirement so test and development clusters can run one member
                  per group. Single-member groups have no synchronous standby and no
                  failover candidate: unsupported for production.
                type: boolean
              upgrade:
                default: {}
                description: UpgradeSpec controls major-version upgrades.
                properties:
                  maxParallelGroups:
                    default: 1
                    minimum: 1
                    type: integer
                  strategy:
                    default: online
                    enum:
                    - online
                    - offline
                    type: string
                type: object
            required:
            - catalog
            - postgresql
            - storage
            type: object
            x-kubernetes-validations:
            - message: replicasPerShard must be >= 3
              rule: self.replicasPerShard >= 3 || (has(self.unsafeSingleReplica) &&
                self.unsafeSingleReplica)
            - message: catalog.replicas must be >= 3 for HA
              rule: self.catalog.replicas >= 3 || (has(self.unsafeSingleReplica) &&
                self.unsafeSingleReplica)
          status:
            description: PgShardClusterStatus is the observed state of a PgShardCluster.
            properties:
              catalogGeneration:
                description: |-
                  CatalogGeneration names the active catalog group (catalog for 0 or
                  1, catalog-g<n> after a catalog major upgrade).
                format: int64
                type: integer
              catalogPGMajor:
                description: |-
                  CatalogPGMajor is the PostgreSQL major the active catalog group
                  runs, probed from the server; zero until first probed.
                type: integer
              catalogUpgrade:
                description: CatalogUpgrade is the catalog group upgrade in flight,
                  if any.
                properties:
                  blockers:
                    description: Blockers lists the preconditions holding the upgrade
                      back.
                    items:
                      type: string
                    type: array
                  fromMajor:
                    type: integer
                  generation:
                    description: Generation names the new-major catalog group (catalog-g<n>).
                    format: int64
                    type: integer
                  message:
                    type: string
                  retiredGeneration:
                    description: |-
                      RetiredGeneration is the old catalog group kept up for rollback
                      after the cutover, until retirement deletes it.
                    format: int64
                    type: integer
                  retiredMajor:
                    type: integer
                  rollbackRequested:
                    description: |-
                      RollbackRequested mirrors the pgshard.io/catalog-upgrade=rollback
                      annotation.
                    type: boolean
                  stage:
                    description: Stage is one of provisioning, copying, catching_up,
                      cutover, retiring.
                    type: string
                  switchedAt:
                    format: date-time
                    type: string
                  toMajor:
                    type: integer
                required:
                - fromMajor
                - generation
                - toMajor
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveShards:
                description: |-
                  EffectiveShards is the shard count of the serving shard set as
                  materialized in the catalog; zero until the catalog exists.
                type: integer
              observedGeneration:
                format: int64
                type: integer
              placementWorkflows:
                description: |-
                  PlacementWorkflows lists the table placement workflows that are
                  active or ended since the last completed one was observed.
                items:
                  description: |-
                    ClusterPlacementWorkflowStatus is one table placement workflow the
                    controller runs (a shard key change, or a move between unsharded,
                    sharded and reference placement).
                  properties:
                    from:
                      description: From and To describe the placements, e.g. "sharded(tenant_id)".
                      type: string
                    message:
                      type: string
                    pauseMs:
                      description: PauseMS is the table-scoped write pause of the
                        swap, once done.
                      format: int64
                      type: integer
                    phase:
                      type: string
                    state:
                      description: State is the workflow state; Phase its stage.
                      type: string
                    table:
                      description: 'Table is the qualified table: database.schema.table.'
                      type: string
                    to:
                      type: string
                    workflowId:
                      description: WorkflowID is the pgshard.workflows row.
                      type: string
                  required:
                  - from
                  - state
                  - table
                  - to
                  - workflowId
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - workflowId
                x-kubernetes-list-type: map
              reshard:
                description: Reshard is the resharding run in flight, if any.
                properties:
                  generation:
                    format: int64
                    type: integer
                  name:
                    description: Name is the PgShardReshard object.
                    type: string
                  pgMajor:
                    description: |-
                      PGMajor is the PostgreSQL major of the pending set when the run is a
                      blue/green major upgrade; zero for a topology reshard.
                    type: integer
                  phase:
                    type: string
                  retiredGeneration:
                    format: int64
                    type: integer
                  retiredPGMajor:
                    description: RetiredPGMajor is the major the retired groups still
                      run.
                    type: integer
                  retiredShardSet:
                    description: |-
                      RetiredShardSet, RetiredGeneration and RetiredShards describe the
                      old set kept up for reverse replication after the write switch.
                    type: string
                  retiredShards:
                    type: integer
                  shardSet:
                    description: ShardSet is the pending catalog shard set; Generation
                      its generation.
                    type: string
                  shards:
                    description: Shards is the number of target groups being provisioned.
                    type: integer
                required:
                - generation
                - name
                - shardSet
                - shards
                type: object
              rollout:
                description: RolloutStatus summarises the rolling operation in flight
                  across groups.
                properties:
                  lastRestartToken:
                    description: |-
                      LastRestartToken is the pgshard.io/restart value the last completed
                      whole-cluster restart carried.
                    type: string
                  member:
                    description: Member is the member being reloaded, restarted or
                      rebuilt.
                    type: string
                  phase:
                    type: string
                  reason:
                    type: string
                type: object
              servingGeneration:
                description: |-
                  ServingGeneration is the generation of the serving shard set; it
                  names the serving shard groups (shard-<id> for 1, shard-<id>-g<n>
                  after).
                format: int64
                type: integer
              servingPGMajor:
                description: |-
                  ServingPGMajor is the PostgreSQL major the serving set's groups run,
                  as stamped in the catalog; zero when the catalog predates upgrades.
                type: integer
              shardMapGeneration:
                format: int64
                type: integer
              shards:
                items:
                  description: ShardStatus reports one shard and its members.
                  properties:
                    epoch:
                      format: int64
                      type: integer
                    id:
                      type: integer
                    members:
                      items:
                        description: MemberStatus reports one PostgreSQL instance
                          in a group.
                        properties:
                          name:
                            type: string
                          pvc:
                            description: PVC is the claim the member's data directory
                              lives on.
                            type: string
                          ready:
                            type: boolean
                          replayLagBytes:
                            format: int64
                            type: integer
                          role:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    primary:
                      type: string
                    rangeEnd:
                      format: int64
                      type: integer
                    rangeStart:
                      format: int64
                      type: integer
                  required:
                  - id
                  type: object
                type: array
              tuning:
                description: TuningStatus lists the settings derived from the profile
                  and resources.
                properties:
                  derived:
                    items:
                      description: DerivedSetting is a PostgreSQL setting the operator
                        computed.
                      properties:
                        name:
                          type: string
                        reason:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
