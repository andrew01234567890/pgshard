---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgshardgroups.pgshard.io
spec:
  group: pgshard.io
  names:
    kind: PgShardGroup
    listKind: PgShardGroupList
    plural: pgshardgroups
    singular: pgshardgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.primary
      name: Primary
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PgShardGroup is the operator's record of one catalog or shard group.
          Users do not write it. Its status carries the designated primary and the
          fencing epoch, which the operator reads back on every reconcile -- but
          it is not the only record of them: the group Lease carries the same two
          values, written before any promotion, and the operator reconstructs from
          the Lease when this object's status has been lost.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PgShardGroupSpec identifies the replication group this object
              mirrors.
            properties:
              clusterRef:
                type: string
              kind:
                enum:
                - catalog
                - shard
                type: string
              nonServing:
                description: |-
                  NonServing marks a reshard target: routers never route to it and its
                  members do not archive WAL until the set becomes serving.
                type: boolean
              shardId:
                type: integer
              shardSet:
                description: ShardSet is the catalog shard set the group serves; empty
                  means default.
                type: string
            required:
            - clusterRef
            - kind
            type: object
          status:
            description: PgShardGroupStatus is the observed state of a replication
              group.
            properties:
              epoch:
                format: int64
                type: integer
              members:
                items:
                  description: MemberStatus reports one PostgreSQL instance in a group.
                  properties:
                    build:
                      description: |-
                        Build is the agent's version, as the agent reports it. During a
                        rolling upgrade the members of one cluster run different binaries
                        for a while, and this is where that is visible; empty means an
                        agent old enough not to say.
                      type: string
                    name:
                      type: string
                    pvc:
                      description: PVC is the claim the member's data directory lives
                        on.
                      type: string
                    ready:
                      type: boolean
                    replayLagBytes:
                      format: int64
                      type: integer
                    role:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              primary:
                type: string
              rollout:
                description: GroupRollout is the rolling operation in flight on one
                  group.
                properties:
                  member:
                    type: string
                  phase:
                    type: string
                  reason:
                    type: string
                  since:
                    description: Since is when the current step began; the hold timeout
                      counts from it.
                    format: date-time
                    type: string
                type: object
              settingsRestartPending:
                description: |-
                  SettingsRestartPending is set once a postmaster-context setting
                  changed; it stays until every member restarted with the new settings.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
